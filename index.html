<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stamp the Electron main process checks after load to confirm
         it loaded the Mac app and not some other Vite dev server
         that happened to be on the configured port. If the stamp is
         missing, main shows a clear error instead of letting a
         marketing/admin site masquerade as the Mac app UI. -->
    <meta name="zeros-app" content="mac" />
    <title>Zeros</title>
    <!-- Pre-bundle theme stamp — kills the startup flash for light-theme
         users. The stylesheet's :root block is DARK; without this stamp the
         document paints dark between stylesheet-apply and the appearance
         store's module-load flush inside the JS bundle. Reads the same
         zeros.appearance.v2 key the store owns
         (mode: system|light|dark; legacy modes — including the retired
         orka-black — fall through to dark, matching the store's migration)
         and resolves "system" via prefers-color-scheme. Must stay inline and
         dependency-free so it runs before ANY bundle bytes evaluate. -->
    <script>
      (function () {
        try {
          var mode = "dark";
          var raw = localStorage.getItem("zeros.appearance.v2");
          if (raw) {
            var parsed = JSON.parse(raw);
            var m = parsed && parsed.mode;
            if (
              m === "light" ||
              m === "system" ||
              m === "dark" ||
              m === "high-contrast"
            )
              mode = m;
          } else if (window.__ZEROS_APPEARANCE_MODE__) {
            // localStorage empty (fresh window OR the OS purged the
            // Caches-backed sessionData) — fall back to the userData-persisted
            // mode the preload exposed (see apps/desktop/electron/preload.ts).
            mode = window.__ZEROS_APPEARANCE_MODE__;
          }
          var variant =
            mode === "light" ||
            ((mode === "system" || mode === "high-contrast") &&
              window.matchMedia &&
              !window.matchMedia("(prefers-color-scheme: dark)").matches)
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", variant);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- The dev server can return this document long before Vite has cold-
         transformed and Chromium has evaluated the renderer graph. The Island
         Z paints straight from this HTML so startup never shows an empty
         window while that graph is compiling. This node deliberately lives
         outside #root: React's auth gate keeps it mounted until the first real
         application/login surface is committed. -->
    <style id="zeros-boot-styles">
      /* Token names with boot fallbacks: the token stylesheet has not loaded
         yet, and once it has the same names resolve to the live tokens. The
         fallbacks equal bg1, fg1 and fg3 (pinned by a test). */
      :root {
        --zeros-boot-bg: var(--bg1, #141414);
        --zeros-boot-top: var(--fg1, #f0f0f0);
        --zeros-boot-bottom: var(--fg3, #a1a1a1);
      }

      :root[data-theme="light"] {
        --zeros-boot-bg: var(--bg1, #ffffff);
        --zeros-boot-top: var(--fg1, #2c2824);
        --zeros-boot-bottom: var(--fg3, #5f5b57);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--zeros-boot-bg);
      }

      #root {
        min-height: 100%;
      }

      #zeros-boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--zeros-boot-bg);
      }

      #zeros-boot[data-zeros-pre-react] {
        opacity: 0;
        animation: zeros-boot-reveal 1ms 120ms forwards;
      }

      /* The Island Z running Weave: rows step on a 72 ms beat, neighbours in
         opposite directions, one 1.8 s loop that lands on the resting Z. Each
         row repeats every four cells, so its start and end read as the Z. */
      .zeros-boot-mark {
        display: block;
        width: 64px;
        height: 64px;
        overflow: hidden;
        user-select: none;
      }

      .zeros-boot-row-r {
        animation: zeros-boot-weave-r 1.8s infinite;
      }

      .zeros-boot-row-l {
        animation: zeros-boot-weave-l 1.8s infinite;
      }

      .zeros-boot-beat-1 {
        animation-delay: 72ms;
      }

      .zeros-boot-beat-2 {
        animation-delay: 144ms;
      }

      .zeros-boot-beat-3 {
        animation-delay: 216ms;
      }

      @keyframes zeros-boot-reveal {
        to {
          opacity: 1;
        }
      }

      @keyframes zeros-boot-weave-r {
        0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        6% { transform: translateX(1px); }
        16% { transform: translateX(1px); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        22% { transform: translateX(2px); }
        32% { transform: translateX(2px); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        38% { transform: translateX(3px); }
        48% { transform: translateX(3px); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        54%,
        100% { transform: translateX(4px); }
      }

      @keyframes zeros-boot-weave-l {
        0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        6% { transform: translateX(-1px); }
        16% { transform: translateX(-1px); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        22% { transform: translateX(-2px); }
        32% { transform: translateX(-2px); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        38% { transform: translateX(-3px); }
        48% { transform: translateX(-3px); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
        54%,
        100% { transform: translateX(-4px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .zeros-boot-row-r,
        .zeros-boot-row-l {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="zeros-boot"
      data-zeros-pre-react
      role="status"
      aria-live="polite"
      aria-label="Loading Zeros"
    >
      <svg class="zeros-boot-mark" viewBox="0 0 4 4" aria-hidden="true">
        <defs>
          <linearGradient id="zeros-boot-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--zeros-boot-top)" />
            <stop offset="1" style="stop-color: var(--zeros-boot-bottom)" />
          </linearGradient>
          <mask id="zeros-boot-weave" maskUnits="userSpaceOnUse" x="0" y="0" width="4" height="4">
            <path fill="white" class="zeros-boot-row-r" d="M-4 0h1v1h-1ZM-2 0h3v1h-3ZM2 0h2v1h-2Z" />
            <path fill="white" class="zeros-boot-row-l zeros-boot-beat-1" d="M2 1h1v1h-1ZM6 1h1v1h-1Z" />
            <path fill="white" class="zeros-boot-row-r zeros-boot-beat-2" d="M-3 2h1v1h-1ZM1 2h1v1h-1Z" />
            <path fill="white" class="zeros-boot-row-l zeros-boot-beat-3" d="M0 3h2v1h-2ZM3 3h3v1h-3ZM7 3h1v1h-1Z" />
          </mask>
        </defs>
        <rect width="4" height="4" mask="url(#zeros-boot-weave)" fill="url(#zeros-boot-fade)" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/apps/desktop/src/renderer/main.tsx"></script>
  </body>
</html>
