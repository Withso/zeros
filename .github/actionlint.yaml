# actionlint 1.7.12 predates these GitHub-hosted labels. This configuration key
# extends its catalog; these jobs still use GitHub-hosted runners. Keep exact
# labels so misspellings remain errors, and remove entries as actionlint learns
# them. Ubuntu 26.04 is exercised on every PR by cloud-runner-qualification.yml.
# https://github.com/actions/runner-images#available-images
self-hosted-runner:
  labels:
    - macos-15-intel
    - ubuntu-26.04

# actionlint 1.7.12 does not know concurrency.queue. Suppress only that exact
# diagnostic in the canary; scripts/ci/validate-concurrency.mjs and its root
# Vitest suite enforce max, retained work, and the job allowlist.
paths:
  .github/workflows/concurrency-canary.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
