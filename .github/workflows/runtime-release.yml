name: Cloud runtime release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Destination channel
        type: choice
        options: [alpha, beta, production]
        default: alpha
        required: true
      action:
        description: Publish on Alpha, promote retained Alpha bytes, or roll back to the recorded previous pin
        type: choice
        options: [publish, promote, rollback]
        default: publish
        required: true
      expected_cp_sha:
        description: Exact 40-character source SHA reported by the destination release identity
        type: string
        required: true
      expected_runtime_sha256:
        description: Exact current destination runtime digest
        type: string
        required: true
      source_sha:
        description: Publish only; exact main commit with successful Preflight and CodeQL
        type: string
        default: ""
      runtime_sha256:
        description: Promote only; exact Alpha-qualified archive digest
        type: string
        default: ""
      alpha_run_id:
        description: Promote only; successful Alpha runtime release run
        type: string
        default: ""
      alpha_run_attempt:
        description: Promote only; successful Alpha runtime release attempt
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  runtime:
    name: Cloud runtime
    uses: ./.github/workflows/runtime-release-run.yml
    with:
      channel: ${{ inputs.channel }}
      action: ${{ inputs.action }}
      expected_cp_sha: ${{ inputs.expected_cp_sha }}
      expected_runtime_sha256: ${{ inputs.expected_runtime_sha256 }}
      source_sha: ${{ inputs.source_sha }}
      runtime_sha256: ${{ inputs.runtime_sha256 }}
      alpha_run_id: ${{ inputs.alpha_run_id }}
      alpha_run_attempt: ${{ inputs.alpha_run_attempt }}
    secrets: inherit
