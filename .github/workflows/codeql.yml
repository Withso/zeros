name: CodeQL

# Static taint/dataflow analysis (injection, path-traversal, prototype-pollution,
# unsafe-deserialization, command-injection, hardcoded-credentials) for ALL JS/TS
# in the repo — no paths filter, so alongside the desktop app (apps/desktop/src/ +
# apps/desktop/electron/) it also covers the control plane, the Pages Functions
# under apps/web/, the marketing site and scripts/. Relevant as the app goes
# multi-user: the engine spawns child processes, reads/writes by path, runs Git,
# bridges renderer ↔ main IPC, and the control plane terminates network input.
#
# Findings remain advisory Code Scanning alerts rather than job failures, but the
# live main ruleset requires the `codeql` context so a missing or broken analysis
# cannot merge silently. Run the same check for merge-queue commits; otherwise a
# required queue context can never report. Code scanning is free on this public
# repository, so results are uploaded and triaged on the Security tab. JS/TS
# needs no build step.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  actions: read # analyze step reads this run's metadata via the Actions API (get-a-workflow-run); omitting it defaults the scope to none → "Resource not accessible by integration"
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        # No `upload:` override — the action's default is `always`, which is what
        # we want: code scanning is free on public repositories, so the SARIF goes
        # to the Security tab and findings become tracked, dismissible alerts.
        # This used to be `upload: never` because a private repo without Advanced
        # Security rejects the upload ("Advanced Security must be enabled…") and
        # fails the job as a configuration error. That constraint is gone, and a
        # scanner whose results are thrown away is worse than no scanner at all.
        # `security-events: write` above is what authorises the upload.
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
