name: Zeros dev E2E
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Hourly canary or Gate 0 rehearsal
        type: choice
        required: true
        default: hourly
        options:
          - hourly
          - gate0
permissions:
  contents: read
  actions: read
concurrency:
  group: zeros-dev-alpha-fixture
  cancel-in-progress: false
jobs:
  lifecycle:
    name: ${{ inputs.profile == 'gate0' && 'gate0' || 'lifecycle' }}
    if: >-
      github.repository == 'Withso/zeros' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.profile == 'gate0' && vars.ZEROS_DEV_GATE0_ENABLED == 'true') ||
       ((github.event_name != 'workflow_dispatch' || inputs.profile == 'hourly') && vars.ZEROS_DEV_E2E_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'gate0' && 135 || 15 }}
    env:
      ZEROS_DEV_PROFILE: ${{ inputs.profile || 'hourly' }}
    steps:
      - name: Start the overall budget
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "ZEROS_DEV_E2E_START_MS=" + Date.now() + "\n")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify predecessor and plan recovery
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/zeros-dev/hourly-actions.mjs
      - name: Restore exact predecessor receipt
        if: steps.plan.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.plan.outputs.artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.previous_run }}
          path: ${{ runner.temp }}/zeros-dev-previous
      - name: Install harness dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute Alpha product lifecycle
        env:
          ZEROS_DEV_E2E_PLAN: ${{ steps.plan.outputs.plan }}
          ZEROS_DEV_FIXTURE_B64: ${{ secrets.ZEROS_DEV_FIXTURE_B64 }}
          AGENT_RUNTIME_ANTHROPIC_API_KEY: ${{ secrets.AGENT_RUNTIME_ANTHROPIC_API_KEY }}
          AGENT_RUNTIME_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_RUNTIME_CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_RUNTIME_OPENAI_API_KEY: ${{ secrets.AGENT_RUNTIME_OPENAI_API_KEY }}
          AGENT_RUNTIME_CODEX_AUTH_JSON: ${{ secrets.AGENT_RUNTIME_CODEX_AUTH_JSON }}
          AGENT_RUNTIME_CURSOR_API_KEY: ${{ secrets.AGENT_RUNTIME_CURSOR_API_KEY }}
        run: pnpm exec tsx scripts/zeros-dev/hourly-main.ts
      - name: Save signed cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: zeros-dev-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zeros-dev-output/receipt.json
          retention-days: 90
          if-no-files-found: error
