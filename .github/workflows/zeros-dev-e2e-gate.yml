name: Zeros dev merge gate
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]
  workflow_run:
    workflows: [Zeros dev E2E]
    branches: [main]
    types: [requested, completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: zeros-dev-merge-gate
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Withso/zeros' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout only trusted main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Refresh every open PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/zeros-dev-status.mjs
