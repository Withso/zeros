name: Publish cloud runtime bundle

# Publication registers immutable bytes; existing qualification and workspace
# lifecycle admission decide whether a runtime can be installed.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Control-plane channel receiving the runtime bundle
        type: choice
        options: [alpha, beta, production]
        default: alpha
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-runtime-bundle-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux runtime bundle
    if: github.event.repository.fork == false && (github.ref == 'refs/heads/main' || (inputs.channel != 'alpha' && startsWith(github.ref, 'refs/heads/release/')))
    permissions:
      contents: read
    uses: ./.github/workflows/cloud-runtime-bundle-build.yml
    with:
      artifact_name: zeros-${{ inputs.channel }}-runtime-build

  publish:
    name: Publish runtime bundle
    needs: build
    if: github.event.repository.fork == false && (github.ref == 'refs/heads/main' || (inputs.channel != 'alpha' && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.channel }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download this run's runtime bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cloud-runtime-bundle
      - name: Verify exact-source CI and publish using GitHub Actions OIDC
        env:
          CLOUD_WORKSPACE_CONTROL_PLANE_URL: ${{ vars.CLOUD_WORKSPACE_CONTROL_PLANE_URL }}
          CLOUD_RUNTIME_OIDC_AUDIENCE: ${{ vars.CLOUD_RUNTIME_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release/runtime-bundle-ci.ts --verify
          pnpm exec tsx scripts/cloud-workspace-validation/runtime-bundle/publish.ts --out-dir "$RUNNER_TEMP/cloud-runtime-bundle"
