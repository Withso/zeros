name: Cloud backend provision
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to provision from release/X.Y.Z (Alpha is already provisioned)
        required: true
        type: choice
        options: [beta, production]
      mode:
        description: Inspect a names-only plan or apply configuration without deploying
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: Apply only - type the channel database name, for example zeros-control-plane-beta
        required: false
        type: string
        default: ""
      enable_cloud:
        description: Enable cloud and its workers only after the qualified worker tuple is selected
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hosted-mutation-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  approve:
    name: Approve Production cloud provisioning
    if: github.event.repository.fork == false && inputs.channel == 'production'
    runs-on: ubuntu-latest
    environment: production-approval
    permissions: {}
    steps:
      - name: Record the approved provisioning run
        run: echo "Production cloud provisioning approved for $GITHUB_SHA on $GITHUB_REF_NAME"
  provision:
    name: Provision cloud backend (${{ inputs.channel }})
    needs: approve
    if: >-
      !cancelled() && github.event.repository.fork == false &&
      (needs.approve.result == 'success' || (inputs.channel != 'production' && needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel }}
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      CLOUD_PROVISION_MODE: ${{ inputs.mode }}
      CLOUD_PROVISION_CONFIRM: ${{ inputs.confirm }}
      CLOUD_PROVISION_ENABLE_CLOUD: ${{ inputs.enable_cloud }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PLANETSCALE_DATABASE: ${{ vars.PLANETSCALE_DATABASE }}
      BOAT_ACCOUNT_SCOPE: ${{ vars.BOAT_ACCOUNT_SCOPE }}
      BOAT_BILLING_ORG: ${{ vars.BOAT_BILLING_ORG }}
      CLOUD_WORKSPACE_S3_ENDPOINT: ${{ vars.CLOUD_WORKSPACE_S3_ENDPOINT }}
      CLOUD_ACCOUNT_ID: ${{ vars.CLOUD_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ZEROS_RELEASE_CANARIES_ENABLED: ${{ vars.ZEROS_RELEASE_CANARIES_ENABLED }}
      RUNTIME_QUALIFICATION_ACTOR_USER_ID: ${{ vars.RUNTIME_QUALIFICATION_ACTOR_USER_ID }}
      WORKER_CANARY_ORGANIZATION_ID: ${{ vars.WORKER_CANARY_ORGANIZATION_ID }}
      WORKER_CANARY_REPOSITORY: ${{ vars.WORKER_CANARY_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/control-plane install --frozen-lockfile
      - name: Plan or apply cloud backend configuration
        env:
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          CLOUD_WORKSPACE_S3_ACCESS_KEY_ID: ${{ secrets.CLOUD_WORKSPACE_S3_ACCESS_KEY_ID }}
          CLOUD_WORKSPACE_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_WORKSPACE_S3_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKER_CANARY_ADMISSION_TOKEN: ${{ secrets.WORKER_CANARY_ADMISSION_TOKEN }}
          WORKER_ADMISSION_CONFIG_JSON: ${{ secrets.WORKER_ADMISSION_CONFIG_JSON }}
        run: pnpm exec tsx scripts/release/cloud-provision-cli.ts
