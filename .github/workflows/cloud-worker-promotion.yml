name: Cloud worker promotion
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [alpha, beta, production]
        required: true
      execute:
        description: Retired v3 producer; execution refuses before allocation. Use runtime bundles.
        type: boolean
        default: false
      reconcile_storage:
        description: Observe retained native cleanup only; no new allocation or qualification
        type: boolean
        default: false
      qualification_profile:
        description: Auto selects FULL only for native-contract changes; FULL is an explicit paid check
        type: choice
        options: [auto, smoke, full]
        default: auto
      services_run_id:
        description: Trusted exact-source release run with API, Pages and WorkOS services proof
        type: string
        required: false
      receipt_required:
        description: Require fresh qualification and a run-bound receipt instead of reusing an unchanged worker
        type: boolean
        default: false
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      before_sha:
        default: ''
        type: string
      alpha_ci_fast_path:
        description: Critical CI only for an authenticated automatic Alpha parent
        default: ''
        type: string
      alpha_forward_only:
        description: Forward-only freshness only for an authenticated automatic Alpha parent
        default: ''
        type: string
      alpha_prepared_version:
        description: Immutable full version from the authenticated automatic Alpha parent
        default: ''
        type: string
      execute:
        default: false
        type: boolean
      reconcile_storage:
        default: false
        type: boolean
      qualification_profile:
        default: auto
        type: string
      services_run_id:
        default: ''
        type: string
      receipt_required:
        default: true
        type: boolean
      caller_gated:
        description: The calling Production release already holds its single human approval
        default: false
        type: boolean
    outputs:
      receipt_issued:
        description: True only after native qualification, cleanup, approval and tuple readback
        value: ${{ jobs.worker.outputs.receipt_issued }}
      receipt_artifact:
        description: Run-bound worker success artifact, empty for plans and reuse
        value: ${{ jobs.worker.outputs.receipt_artifact }}
permissions:
  contents: read
  actions: read
jobs:
  # Production's single human approval for a direct dispatch. A call from the
  # Production release passes caller_gated, which a dispatch cannot set.
  approve:
    name: Approve Production worker promotion
    if: github.event.repository.fork == false && inputs.channel == 'production' && inputs.caller_gated != true
    runs-on: ubuntu-latest
    environment: production-approval
    permissions: {}
    steps:
      - name: Record the approved worker promotion
        run: echo "Production worker promotion approved for $GITHUB_SHA on $GITHUB_REF_NAME"
  worker:
    name: worker
    needs: approve
    if: >-
      !cancelled() && github.event.repository.fork == false && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.approve.result == 'success' || (needs.approve.result == 'skipped' && (inputs.channel != 'production' || inputs.caller_gated == true)))
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    timeout-minutes: 330
    outputs:
      receipt_issued: ${{ steps.promote.outputs.receipt_issued }}
      receipt_artifact: ${{ steps.promote.outputs.receipt_artifact }}
    concurrency:
      group: hosted-mutation-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
      RELEASE_BRANCH: ${{ inputs.branch || github.ref_name }}
      RELEASE_BASE: ${{ inputs.before_sha || '' }}
      ZEROS_ALPHA_CI_FAST_PATH: ${{ inputs.alpha_ci_fast_path }}
      ZEROS_ALPHA_FORWARD_ONLY: ${{ inputs.alpha_forward_only }}
      ALPHA_PREPARED_VERSION: ${{ inputs.alpha_prepared_version }}
      ZEROS_WORKER_PROMOTION: ${{ vars.ZEROS_WORKER_PROMOTION }}
      WORKER_EXECUTE: ${{ inputs.execute }}
      WORKER_RECONCILE_STORAGE: ${{ inputs.reconcile_storage }}
      WORKER_QUALIFICATION_PROFILE: ${{ inputs.qualification_profile || 'auto' }}
      WORKER_SERVICES_RUN_ID: ${{ inputs.services_run_id || github.run_id }}
      WORKER_RECEIPT_REQUIRED: ${{ inputs.receipt_required }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PLANETSCALE_ORG: ${{ vars.PLANETSCALE_ORG }}
      PLANETSCALE_DATABASE: ${{ vars.PLANETSCALE_DATABASE }}
      PLANETSCALE_BRANCH: ${{ vars.PLANETSCALE_BRANCH }}
      BOAT_BILLING_ORG: ${{ vars.BOAT_BILLING_ORG }}
      BOAT_ACCOUNT_SCOPE: ${{ vars.BOAT_ACCOUNT_SCOPE }}
      BOAT_BASE_SNAPSHOT: ${{ vars.BOAT_BASE_SNAPSHOT }}
      BOAT_BUILDER_BUDGET_HOURS: ${{ vars.BOAT_BUILDER_BUDGET_HOURS }}
      BOAT_CANARY_BUDGET_HOURS: ${{ vars.BOAT_CANARY_BUDGET_HOURS }}
      BOAT_WORKER_BUDGET_HOURS: ${{ vars.BOAT_WORKER_BUDGET_HOURS }}
      RUNTIME_QUALIFICATION_ACTOR_USER_ID: ${{ vars.RUNTIME_QUALIFICATION_ACTOR_USER_ID }}
      RUNTIME_QUALIFICATION_CREDENTIAL_KINDS: ${{ vars.RUNTIME_QUALIFICATION_CREDENTIAL_KINDS }}
      WORKER_CANARY_ORGANIZATION_ID: ${{ vars.WORKER_CANARY_ORGANIZATION_ID }}
    steps:
      - name: Refuse retired v3 worker promotion
        if: inputs.reconcile_storage != true && (inputs.execute == true || env.ZEROS_WORKER_PROMOTION == 'enabled')
        run: |
          echo '::error::v3 release worker images are retired; v4 runtime bundles are the supported artifact'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/control-plane install --frozen-lockfile
      - name: Exact-source Preflight and CodeQL gate
        if: inputs.execute || inputs.reconcile_storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release/ci-cli.ts --wait
      - name: Worker plan or guarded execution
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          WORKER_ADMISSION_CONFIG_JSON: ${{ secrets.WORKER_ADMISSION_CONFIG_JSON }}
          WORKER_CANARY_ADMISSION_TOKEN: ${{ secrets.WORKER_CANARY_ADMISSION_TOKEN }}
        run: |
          if [ "$WORKER_RECONCILE_STORAGE" = true ]; then
            pnpm exec tsx scripts/release/worker-cli.ts --reconcile-storage
          elif [ "$WORKER_EXECUTE" = true ]; then
            pnpm exec tsx scripts/release/worker-cli.ts --execute
          else
            pnpm exec tsx scripts/release/worker-cli.ts --plan
          fi
      - name: Save success receipt
        if: success() && steps.promote.outputs.receipt_issued == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-promotion-${{ inputs.channel }}-${{ inputs.source_sha || github.sha }}
          path: .context/release/worker-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Save plan (never a success receipt)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-plan-${{ inputs.channel }}-${{ inputs.source_sha || github.sha }}
          path: .context/release/worker-plan.json
          include-hidden-files: true
          if-no-files-found: ignore
