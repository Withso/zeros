name: Controlled cutover
# Runs migrations the automated hosted lane refuses (controlled-downtime and
# contract boundaries, such as a first rollout's 0101/0103) for one channel:
# plan and check the typed approvals, hold independent Railway and Pages
# deploys, retarget sources, fence writers with maintenance mode, back up and
# migrate, deploy the exact SHA, upload Pages and verify WorkOS. Dispatch from
# `main` for Alpha or from `release/X.Y.Z` for Beta/Production; Production
# waits for its single approval in `production-approval`. Afterwards rerun the failed desktop release
# for the same SHA. See docs/deployment-environments.md.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to cut over (alpha from main; beta or production from release/X.Y.Z)
        required: true
        type: choice
        options: [alpha, beta, production]
      approvals:
        description: Comma-separated controlled migrations to approve; must equal the pending set exactly (empty when none)
        required: false
        type: string
        default: ""
      confirm:
        description: Type the channel database name, for example zeros-control-plane-beta
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-mutation-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  # Production's single human approval; `production-approval` holds the
  # required reviewer and no secrets. Alpha and Beta skip it.
  approve:
    name: Approve Production cutover
    if: github.event.repository.fork == false && inputs.channel == 'production'
    runs-on: ubuntu-latest
    environment: production-approval
    permissions: {}
    steps:
      - name: Record the approved cutover
        run: echo "Production cutover approved for $GITHUB_SHA on $GITHUB_REF_NAME"
  cutover:
    name: Controlled cutover (${{ inputs.channel }})
    needs: approve
    if: >-
      !cancelled() && github.event.repository.fork == false &&
      (needs.approve.result == 'success' || (inputs.channel != 'production' && needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: ${{ inputs.channel }}
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      # This explicitly dispatched, environment-gated run is itself the hosted
      # mutation, so the channel's automatic promotion switch may stay off.
      ZEROS_HOSTED_PROMOTION: enabled
      CUTOVER_APPROVALS: ${{ inputs.approvals }}
      CUTOVER_CONFIRM: ${{ inputs.confirm }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PLANETSCALE_ORG: ${{ vars.PLANETSCALE_ORG }}
      PLANETSCALE_DATABASE: ${{ vars.PLANETSCALE_DATABASE }}
      PLANETSCALE_BRANCH: ${{ vars.PLANETSCALE_BRANCH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_APP_PROJECT: ${{ vars.CF_PAGES_APP_PROJECT }}
      CF_PAGES_OPS_PROJECT: ${{ vars.CF_PAGES_OPS_PROJECT }}
      AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
      AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
      AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
      AUTH_WEB_CLIENT_ID: ${{ vars.AUTH_WEB_CLIENT_ID }}
      AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER }}
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED }}
      ZEROS_WORKER_PROMOTION: ${{ vars.ZEROS_WORKER_PROMOTION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/control-plane install --frozen-lockfile
      - run: npm --prefix apps/web ci
      - name: Verify the committed backend before migration
        run: pnpm --dir apps/control-plane build
      - name: Controlled cutover
        env:
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release/cutover-cli.ts
      - name: Save cutover receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-cutover-${{ inputs.channel }}-${{ github.sha }}
          path: .context/release/cutover-receipt.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      # The allowlisted journal (stage, maintenance state, deployment and backup
      # identities, ledger state) is the recovery record when a stage fails.
      - name: Save cutover journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-cutover-journal-${{ inputs.channel }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .context/release/cutover-journal.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
