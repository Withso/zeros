name: Hosted promotion
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      before_sha:
        default: ""
        type: string
permissions:
  contents: read
  actions: read
jobs:
  guard:
    name: Rollout switch and change guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
      worker_enabled: ${{ steps.guard.outputs.worker_enabled }}
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      RELEASE_BASE: ${{ inputs.before_sha }}
      ZEROS_HOSTED_PROMOTION: ${{ vars.ZEROS_HOSTED_PROMOTION }}
      ZEROS_WORKER_PROMOTION: ${{ vars.ZEROS_WORKER_PROMOTION }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PLANETSCALE_ORG: ${{ vars.PLANETSCALE_ORG }}
      PLANETSCALE_DATABASE: ${{ vars.PLANETSCALE_DATABASE }}
      PLANETSCALE_BRANCH: ${{ vars.PLANETSCALE_BRANCH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_APP_PROJECT: ${{ vars.CF_PAGES_APP_PROJECT }}
      CF_PAGES_OPS_PROJECT: ${{ vars.CF_PAGES_OPS_PROJECT }}
      AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER }}
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact-source required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release/ci-cli.ts --verify
      - name: Validate switch, authority names, and changed inputs
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec tsx scripts/release/guard.ts
  worker:
    needs: [guard, services]
    if: needs.guard.outputs.enabled == 'true' && needs.guard.outputs.worker_enabled == 'true'
    uses: ./.github/workflows/cloud-worker-promotion.yml
    with:
      channel: ${{ inputs.channel }}
      source_sha: ${{ inputs.source_sha }}
      branch: ${{ inputs.branch }}
      before_sha: ${{ inputs.before_sha }}
      execute: true
      # Production reaches this only through release.yml's approval job.
      caller_gated: true
    secrets: inherit
  services:
    name: Hosted services
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: ${{ inputs.channel }}
    concurrency:
      group: hosted-mutation-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      ZEROS_HOSTED_PROMOTION: ${{ vars.ZEROS_HOSTED_PROMOTION }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PLANETSCALE_ORG: ${{ vars.PLANETSCALE_ORG }}
      PLANETSCALE_DATABASE: ${{ vars.PLANETSCALE_DATABASE }}
      PLANETSCALE_BRANCH: ${{ vars.PLANETSCALE_BRANCH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_APP_PROJECT: ${{ vars.CF_PAGES_APP_PROJECT }}
      CF_PAGES_OPS_PROJECT: ${{ vars.CF_PAGES_OPS_PROJECT }}
      AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
      AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
      AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
      AUTH_WEB_CLIENT_ID: ${{ vars.AUTH_WEB_CLIENT_ID }}
      AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
      WORKER_PROMOTION_REQUIRED: ${{ needs.guard.outputs.worker_enabled }}
      ZEROS_WORKER_PROMOTION: ${{ vars.ZEROS_WORKER_PROMOTION }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER }}
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/control-plane install --frozen-lockfile
      - run: npm --prefix apps/web ci
      - name: Verify the committed backend before migration
        run: pnpm --dir apps/control-plane build
      - name: Promote services and verify WorkOS
        env:
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec tsx scripts/release/cli.ts --plan
          pnpm exec tsx scripts/release/cli.ts --services
      - name: Save services receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-services-${{ inputs.channel }}-${{ inputs.source_sha }}
          path: .context/release/hosted-services.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  promote:
    name: Hosted mutation
    needs: [guard, services, worker]
    if: always() && needs.guard.result == 'success' && needs.guard.outputs.enabled == 'true' && needs.services.result == 'success' && (needs.worker.result == 'success' || needs.worker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.channel }}
    concurrency:
      group: hosted-mutation-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      ZEROS_HOSTED_PROMOTION: ${{ vars.ZEROS_HOSTED_PROMOTION }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PLANETSCALE_ORG: ${{ vars.PLANETSCALE_ORG }}
      PLANETSCALE_DATABASE: ${{ vars.PLANETSCALE_DATABASE }}
      PLANETSCALE_BRANCH: ${{ vars.PLANETSCALE_BRANCH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_APP_PROJECT: ${{ vars.CF_PAGES_APP_PROJECT }}
      CF_PAGES_OPS_PROJECT: ${{ vars.CF_PAGES_OPS_PROJECT }}
      AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
      AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
      AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
      AUTH_WEB_CLIENT_ID: ${{ vars.AUTH_WEB_CLIENT_ID }}
      AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
      WORKER_PROMOTION_REQUIRED: ${{ needs.guard.outputs.worker_enabled }}
      ZEROS_WORKER_PROMOTION: ${{ vars.ZEROS_WORKER_PROMOTION }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER }}
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/control-plane install --frozen-lockfile
      - name: Provider preflight and ordered promotion
        env:
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release/cli.ts --finalize
      - name: Save success receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-promotion-${{ inputs.channel }}-${{ inputs.source_sha }}
          path: .context/release/hosted-receipt.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
