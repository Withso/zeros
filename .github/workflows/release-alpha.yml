name: Release (alpha)

# Alpha channel — auto-ships on every push to main. This is the dogfood ring:
# a real, Developer-ID-SIGNED build that auto-updates in place, but NOT notarized
# (notarization is the slow, Apple-queue-variable step — see the header of
# release.yml). Skipping it makes an Alpha available minutes after merge. Trade-off:
# the FIRST install of "Zeros Alpha" shows the one-time "Apple could not verify…"
# Gatekeeper prompt → right-click Open, or System Settings ▸ Privacy & Security ▸
# Open Anyway. After that every update is an in-place swap (no prompt). Signing is
# kept (fast, ~seconds) because electron-updater's macOS in-place update requires
# a valid, matching code signature — notarization is not part of that check.
#
# Alpha installs as a SEPARATE app (appId com.zeros.alpha · "Zeros Alpha") with its
# OWN data dir (com.zeros.alpha), dot-dir (~/.zeros-alpha), workspaces root
# (~/zeros-alpha/workspaces), engine port block (24213+) and deep-link scheme
# (zeros-alpha://) — so it coexists with Beta AND Production and never shares state.
#
# WHERE ALPHA SITS IN THE LADDER:
#
#   main ───────────────► Alpha   (THIS FILE — auto, every merge, disposable)
#     └─ release/x.y.z ─► Beta    (release-beta.yml — a FROZEN stabilization cut)
#          └─ tag vx.y.z ► Prod   (release.yml — built from that EXACT commit)
#
# Alpha is the continuous-integration ring: it churns, and it is safe to break. Beta
# is the cut you stabilize and feature-test. Production is a rebuild of the SAME
# commit Beta validated — before this model release.yml rebuilt main HEAD at dispatch
# time, so the bytes tested in Beta were never the bytes shipped. Channel-gated
# features (apps/desktop/src/renderer/config/release-channel.ts) promote along the same ladder:
# ["dev","alpha"] → +"beta" → +"stable".
#
# SERVING: installed alphas auto-update straight from the rolling "alpha" GitHub
# prerelease published below — electron-updater's generic provider reads
# /releases/download/alpha/alpha-mac.yml and resolves the zip named inside it against
# the same base. One release is both the manual-install source (constant-named
# Zeros-Alpha-latest-arm64.dmg) and the update feed, so there is nothing to keep in
# sync and no storage secrets. This used to mirror the payload to Cloudflare R2,
# which existed only because the repo was private and anonymous clients get 404 on
# a private repo's release assets.
#
# Exact-source Preflight and CodeQL gate hosted mutation and feed publication.
# With ZEROS_ALPHA_CI_FAST_PATH=enabled, automatic Alpha uses Preflight's
# successful alpha-gate job alone (no CodeQL wait) while the deferred jobs finish. Other callers and
# an unset/disabled flag retain the full-workflow policy.
# Signing and Linux runtime builds start concurrently across commits. Hosted
# promotion overlaps signing; only the final publisher has repository write scope.

on:
  push:
    branches: [main]

# Candidates prepare concurrently. Only the reusable publication call below
# holds the Alpha destination lock, from entry revalidation through both feeds.

# Read-only default. The write scope this workflow genuinely needs (moving the
# rolling `alpha` tag and its prerelease assets) is declared on the job instead, so
# it is scoped rather than granted to the whole file — which matters here because
# the same file runs third-party setup actions next to the Developer ID cert.
permissions:
  contents: read

jobs:
  # Freeze the complete version before signing or mutation. Different runner
  # checkout times can see different stable tags; neither consumer recomputes it.
  metadata:
    name: Prepare Alpha version
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compute the immutable Alpha version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(node scripts/compute-version.mjs)
          ALPHA="${BASE}-alpha.${RUN_NUMBER}"
          echo "version=$ALPHA" >> "$GITHUB_OUTPUT"
          echo "Prepared Alpha version: $ALPHA"

  ci:
    name: Exact-source Preflight and CodeQL barrier
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.barrier.outputs.ready }}
    env:
      RELEASE_CHANNEL: alpha
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      ZEROS_ALPHA_CI_FAST_PATH: ${{ vars.ZEROS_ALPHA_CI_FAST_PATH }}
      ZEROS_ALPHA_FORWARD_ONLY: ${{ vars.ZEROS_ALPHA_FORWARD_ONLY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for exact-source Alpha CI
        id: barrier
        run: pnpm exec tsx scripts/release/ci-cli.ts --wait
      - name: Save Alpha admission receipt
        if: success() && steps.barrier.outputs.admission_issued == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-admission-${{ github.sha }}
          path: .context/release/alpha-admission.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  runtime-build:
    name: Build Linux runtime bundle
    # Read-only exact-source build: it starts with the run instead of waiting
    # for the CI barrier. Publication still needs this job and hosted promotion,
    # which itself needs the barrier.
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/contained-execution-runtime
      - name: Build and verify the exact-source runtime
        run: bash scripts/ci/with-userns.sh pnpm cloud:runtime-bundle:build --out-dir "$RUNNER_TEMP/cloud-runtime-bundle" --source-commit "$GITHUB_SHA"
      - name: Save runtime bundle outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeros-alpha-runtime-build-${{ github.sha }}
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
          path: |
            ${{ runner.temp }}/cloud-runtime-bundle/*.tar.gz
            ${{ runner.temp }}/cloud-runtime-bundle/descriptor.json
            ${{ runner.temp }}/cloud-runtime-bundle/manifest.json
            ${{ runner.temp }}/cloud-runtime-bundle/build-receipt.json

  build:
    name: Build + sign Alpha (macOS arm64 · NOT notarized)
    needs: metadata
    # Don't fire on forks (no signing secrets / release perms there). Key this
    # to repository identity rather than an owner/name pair so an ownership
    # transfer cannot silently disable the alpha release job again.
    if: github.event.repository.fork == false
    runs-on: macos-latest
    # Store signing and release credentials in this protected environment, with
    # main as the only deployment branch. Repository-level secrets would be
    # exposed to every workflow/ref that can name them.
    environment: alpha
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      cloud_enabled: ${{ steps.capability.outputs.cloud_enabled }}
    env:
      RELEASE_CHANNEL: alpha
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      ALPHA_PREPARED_VERSION: ${{ needs.metadata.outputs.version }}
      # Seen by electron:compile (bakes __ZEROS_CHANNEL_BAKED__) AND the
      # electron-builder wrapper (applies the alpha appId/productName/artifact
      # overrides). One job-level value keeps them in lockstep.
      ZEROS_CHANNEL: alpha
      # Protected release capability, baked into both Electron main and the
      # packaged engine. Unset environments remain explicitly fail-closed.
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED || 'false' }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER || 'daytona' }}

    steps:
      - name: Require signing credentials
        # Runs FIRST, before checkout, so a missing cert costs seconds instead of
        # failing ~8 minutes later inside electron-builder with an opaque
        # "<workspace> not a file" (eb resolves an empty CSC_LINK as a certificate
        # PATH, lands on the working directory, and dies).
        #
        # This replaces the old `SIGNED: ${{ secrets.CSC_LINK != '' }}` fallback,
        # which read like a supported unsigned path but could never execute.
        # Alpha must be signed for a different reason than stable: electron-updater's
        # macOS in-place update REQUIRES a valid signature, so an unsigned alpha
        # would publish fine and silently break auto-update — and alpha is the
        # channel that auto-updates on every push. No APPLE_* here: alpha is signed
        # but deliberately NOT notarized.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "$CSC_LINK" ] || MISSING="$MISSING CSC_LINK"
          [ -n "$CSC_KEY_PASSWORD" ] || MISSING="$MISSING CSC_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required signing secrets:$MISSING"
            echo "Alpha is Developer-ID signed; electron-updater needs a valid signature to update in place."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✓ signing credentials present"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history + tags so compute-version.mjs reads the existing
          # vMAJOR.MINOR.* release tags to derive the next stable base.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (for engine sidecar compile)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Record the baked cloud capability
        id: capability
        # tsup bakes exactly `ZEROS_CLOUD_WORKSPACES_ENABLED === "true"` into
        # main.cjs. Publication requires its own decision to match this one.
        run: |
          if [ "$ZEROS_CLOUD_WORKSPACES_ENABLED" = "true" ]; then echo "cloud_enabled=true"; else echo "cloud_enabled=false"; fi >> "$GITHUB_OUTPUT"

      - name: Compute alpha version
        id: version
        # Preserve the producer step identity, consuming the parent's immutable
        # metadata output. Never recompute from this later checkout's stable tags.
        run: |
          echo "version=$ALPHA_PREPARED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version into package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Qualify ZSR on the shipping kernel
        run: pnpm check:zsr

      - name: Build engine sidecar (bun → binaries/zeros-engine-*)
        run: pnpm build:sidecar

      - name: Smoke-test packaged engine (health + workspace lifecycle)
        run: pnpm smoke:engine

      - name: Verify Alpha hosted-environment routing
        env:
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_CONTROL_PLANE_URL: ${{ vars.VITE_CONTROL_PLANE_URL || secrets.VITE_CONTROL_PLANE_URL }}
          VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES: ${{ vars.VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES }}
          VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64: ${{ vars.VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64 }}
          AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
          AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
        run: pnpm exec tsx scripts/release-environment.ts alpha

      - name: Compile Electron main + preload (bakes channel=alpha)
        env:
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_CONTROL_PLANE_URL: ${{ vars.VITE_CONTROL_PLANE_URL || secrets.VITE_CONTROL_PLANE_URL }}
          VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES: ${{ vars.VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES }}
          VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64: ${{ vars.VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64 }}
          AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
          AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
        run: pnpm electron:compile

      - name: Build Vite renderer
        # Same VITE_* set as the prod build (analytics + environment URLs) PLUS
        # VITE_ZEROS_CHANNEL=alpha so the renderer's feature flags resolve to the
        # alpha channel.
        env:
          VITE_POSTHOG_KEY_PROD: ${{ secrets.VITE_POSTHOG_KEY_PROD }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_CONTROL_PLANE_URL: ${{ vars.VITE_CONTROL_PLANE_URL || secrets.VITE_CONTROL_PLANE_URL }}
          VITE_ZEROS_CHANNEL: alpha
        run: pnpm build:ui

      - name: Package .dmg + .zip (sign only — NO notarization)
        # CSC_LINK present → Developer-ID signed (afterPack self-skips its ad-hoc
        # resign). We deliberately do NOT submit to Apple's notary — that's the
        # slow part, and alpha accepts the one-time "Open Anyway". electron-builder
        # emits alpha-mac.yml because the version is a -alpha prerelease.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/electron-builder-run.mjs --publish never

      - name: Assert differential update blockmap
        # Keep alpha representative of production update behavior. Missing this
        # file is correctness-safe, but makes every update download the full zip.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BLOCKMAP="release/Zeros-Alpha-${VERSION}-arm64-mac.zip.blockmap"
          if [ ! -f "$BLOCKMAP" ]; then
            echo "::error::$BLOCKMAP not found — electron-builder did not emit the differential-update blockmap."
            ls -la release || true
            exit 1
          fi
          echo "✓ differential-update blockmap: $BLOCKMAP"

      - name: Smoke-test terminal in the packaged app
        # Catches a native PTY that loads but cannot spawn (the beta.58
        # `posix_spawnp failed` regression) before the rolling alpha is replaced.
        run: pnpm smoke:packaged-pty

      - name: Verify installer + updater signatures
        # The updater installs the ZIP, not the DMG. Verify both independently,
        # require the expected Apple team + bundle identity + secure timestamp,
        # and prove both containers carry the same signed root before publishing.
        # Alpha is intentionally not notarized, so Gatekeeper/stapler checks stay
        # exclusive to the Production workflow.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="release/Zeros-Alpha-${VERSION}-arm64.dmg"
          ZIP="release/Zeros-Alpha-${VERSION}-arm64-mac.zip"
          node scripts/verify-macos-release-artifacts.mjs \
            --dmg "$DMG" \
            --zip "$ZIP" \
            --app-name "Zeros Alpha.app" \
            --bundle-id com.zeros.alpha \
            --team-id H8MS56JU2Z

      - name: Write signed Alpha build metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_CLOUD_ENABLED: ${{ steps.capability.outputs.cloud_enabled }}
        run: pnpm exec tsx scripts/release/alpha-build-cli.ts --record

      - name: Save signed Alpha artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeros-alpha-arm64-build-${{ github.sha }}
          overwrite: true
          if-no-files-found: error
          retention-days: 5
          path: |
            release/Zeros-Alpha-*-arm64.dmg
            release/Zeros-Alpha-*-arm64-mac.zip
            release/Zeros-Alpha-*-arm64-mac.zip.blockmap
            release/alpha-mac.yml
            release/alpha-build-metadata.json

  # One call owns the complete destination transaction. Its permission ceiling
  # allows the inner publishers; preparation and inner read-only jobs stay narrow.
  publication:
    name: Alpha publication
    needs: [ci, metadata]
    if: github.event.repository.fork == false && needs.ci.outputs.ready == 'true'
    concurrency:
      group: release-alpha
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/alpha-publication.yml
    with:
      alpha_prepared_version: ${{ needs.metadata.outputs.version }}
      before_sha: ${{ github.event.before || '' }}
      alpha_ci_fast_path: ${{ vars.ZEROS_ALPHA_CI_FAST_PATH }}
      alpha_forward_only: ${{ vars.ZEROS_ALPHA_FORWARD_ONLY }}
    secrets: inherit
