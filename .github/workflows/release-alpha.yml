name: Release (alpha)

# Alpha channel — auto-ships on every push to main. This is the dogfood ring:
# a real, Developer-ID-SIGNED build that auto-updates in place, but NOT notarized
# (notarization is the slow, Apple-queue-variable step — see the header of
# release.yml). Skipping it makes an Alpha available minutes after merge. Trade-off:
# the FIRST install of "Zeros Alpha" shows the one-time "Apple could not verify…"
# Gatekeeper prompt → right-click Open, or System Settings ▸ Privacy & Security ▸
# Open Anyway. After that every update is an in-place swap (no prompt). Signing is
# kept (fast, ~seconds) because electron-updater's macOS in-place update requires
# a valid, matching code signature — notarization is not part of that check.
#
# Alpha installs as a SEPARATE app (appId com.zeros.alpha · "Zeros Alpha") with its
# OWN data dir (com.zeros.alpha), dot-dir (~/.zeros-alpha), workspaces root
# (~/zeros-alpha/workspaces), engine port block (24213+) and deep-link scheme
# (zeros-alpha://) — so it coexists with Beta AND Production and never shares state.
#
# WHERE ALPHA SITS IN THE LADDER:
#
#   main ───────────────► Alpha   (THIS FILE — auto, every merge, disposable)
#     └─ release/x.y.z ─► Beta    (release-beta.yml — a FROZEN stabilization cut)
#          └─ tag vx.y.z ► Prod   (release.yml — built from that EXACT commit)
#
# Alpha is the continuous-integration ring: it churns, and it is safe to break. Beta
# is the cut you stabilize and feature-test. Production is a rebuild of the SAME
# commit Beta validated — before this model release.yml rebuilt main HEAD at dispatch
# time, so the bytes tested in Beta were never the bytes shipped. Channel-gated
# features (apps/desktop/src/renderer/config/release-channel.ts) promote along the same ladder:
# ["dev","alpha"] → +"beta" → +"stable".
#
# SERVING: installed alphas auto-update straight from the rolling "alpha" GitHub
# prerelease published below — electron-updater's generic provider reads
# /releases/download/alpha/alpha-mac.yml and resolves the zip named inside it against
# the same base. One release is both the manual-install source (constant-named
# Zeros-Alpha-latest-arm64.dmg) and the update feed, so there is nothing to keep in
# sync and no storage secrets. This used to mirror the payload to Cloudflare R2,
# which existed only because the repo was private and anonymous clients get 404 on
# a private repo's release assets.
#
# Exact-source Preflight and CodeQL gate hosted mutation and feed publication.
# Signing starts in parallel; only the final publisher has repository write scope.

on:
  push:
    branches: [main]

# One Alpha destination. Finish an active cutover before starting another run.
concurrency:
  # One destination across branches; never cancel an active schema cutover.
  group: release-alpha
  cancel-in-progress: false

# Read-only default. The write scope this workflow genuinely needs (moving the
# rolling `alpha` tag and its prerelease assets) is declared on the job instead, so
# it is scoped rather than granted to the whole file — which matters here because
# the same file runs third-party setup actions next to the Developer ID cert.
permissions:
  contents: read

jobs:
  ci:
    name: Exact-source Preflight and CodeQL barrier
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_CHANNEL: alpha
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/release/ci-cli.ts --wait

  hosted:
    name: Hosted promotion (alpha)
    needs: ci
    if: github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hosted-promotion.yml
    with:
      channel: alpha
      source_sha: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      before_sha: ${{ github.event.before || '' }}
    secrets: inherit

  build:
    name: Build + sign Alpha (macOS arm64 · NOT notarized)
    # Don't fire on forks (no signing secrets / release perms there). Key this
    # to repository identity rather than an owner/name pair so an ownership
    # transfer cannot silently disable the alpha release job again.
    if: github.event.repository.fork == false
    runs-on: macos-latest
    # Store signing and release credentials in this protected environment, with
    # main as the only deployment branch. Repository-level secrets would be
    # exposed to every workflow/ref that can name them.
    environment: alpha
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_CHANNEL: alpha
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      # Seen by electron:compile (bakes __ZEROS_CHANNEL_BAKED__) AND the
      # electron-builder wrapper (applies the alpha appId/productName/artifact
      # overrides). One job-level value keeps them in lockstep.
      ZEROS_CHANNEL: alpha
      # Protected release capability, baked into both Electron main and the
      # packaged engine. Unset environments remain explicitly fail-closed.
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED || 'false' }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER || 'daytona' }}

    steps:
      - name: Require signing credentials
        # Runs FIRST, before checkout, so a missing cert costs seconds instead of
        # failing ~8 minutes later inside electron-builder with an opaque
        # "<workspace> not a file" (eb resolves an empty CSC_LINK as a certificate
        # PATH, lands on the working directory, and dies).
        #
        # This replaces the old `SIGNED: ${{ secrets.CSC_LINK != '' }}` fallback,
        # which read like a supported unsigned path but could never execute.
        # Alpha must be signed for a different reason than stable: electron-updater's
        # macOS in-place update REQUIRES a valid signature, so an unsigned alpha
        # would publish fine and silently break auto-update — and alpha is the
        # channel that auto-updates on every push. No APPLE_* here: alpha is signed
        # but deliberately NOT notarized.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "$CSC_LINK" ] || MISSING="$MISSING CSC_LINK"
          [ -n "$CSC_KEY_PASSWORD" ] || MISSING="$MISSING CSC_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required signing secrets:$MISSING"
            echo "Alpha is Developer-ID signed; electron-updater needs a valid signature to update in place."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✓ signing credentials present"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history + tags so compute-version.mjs reads the existing
          # vMAJOR.MINOR.* release tags to derive the next stable base.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (for engine sidecar compile)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compute alpha version
        id: version
        # Alpha version = <next stable>-alpha.<run_number>. The -alpha.N prerelease
        # (a) makes electron-builder emit alpha-mac.yml (channel auto-detected from
        # the prerelease tag), and (b) is ignored by compute-version.mjs's
        # plain-integer patch regex, so alpha tags never bump the stable sequence.
        # run_number is monotonic, so alpha builds always sort newest-last.
        #
        # run_number goes through `env:` rather than being interpolated straight
        # into the script. It is a GitHub-controlled integer so nothing can be
        # smuggled through it, but `${{ }}` inside a `run:` block is the shape of
        # a script-injection bug, and leaving zero instances of it in the tree
        # means a reader never has to work out which ones are safe.
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(node scripts/compute-version.mjs)
          ALPHA="${BASE}-alpha.${RUN_NUMBER}"
          echo "version=$ALPHA" >> "$GITHUB_OUTPUT"
          echo "Alpha version: $ALPHA (next stable base: $BASE)"

      - name: Write version into package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Qualify ZSR on the shipping kernel
        run: pnpm check:zsr

      - name: Build engine sidecar (bun → binaries/zeros-engine-*)
        run: pnpm build:sidecar

      - name: Smoke-test packaged engine (health + workspace lifecycle)
        run: pnpm smoke:engine

      - name: Verify Alpha hosted-environment routing
        env:
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_CONTROL_PLANE_URL: ${{ vars.VITE_CONTROL_PLANE_URL || secrets.VITE_CONTROL_PLANE_URL }}
          VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES: ${{ vars.VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES }}
          VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64: ${{ vars.VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64 }}
          AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
          AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
        run: pnpm exec tsx scripts/release-environment.ts alpha

      - name: Compile Electron main + preload (bakes channel=alpha)
        env:
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_CONTROL_PLANE_URL: ${{ vars.VITE_CONTROL_PLANE_URL || secrets.VITE_CONTROL_PLANE_URL }}
          VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES: ${{ vars.VITE_CLOUD_WORKSPACE_PREVIEW_HOST_SUFFIXES }}
          VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64: ${{ vars.VITE_CLOUD_WORKSPACE_SSH_KNOWN_HOSTS_B64 }}
          AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
          AUTH_DESKTOP_CLIENT_ID: ${{ vars.AUTH_DESKTOP_CLIENT_ID }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
        run: pnpm electron:compile

      - name: Build Vite renderer
        # Same VITE_* set as the prod build (analytics + environment URLs) PLUS
        # VITE_ZEROS_CHANNEL=alpha so the renderer's feature flags resolve to the
        # alpha channel.
        env:
          VITE_POSTHOG_KEY_PROD: ${{ secrets.VITE_POSTHOG_KEY_PROD }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_CONTROL_PLANE_URL: ${{ vars.VITE_CONTROL_PLANE_URL || secrets.VITE_CONTROL_PLANE_URL }}
          VITE_ZEROS_CHANNEL: alpha
        run: pnpm build:ui

      - name: Package .dmg + .zip (sign only — NO notarization)
        # CSC_LINK present → Developer-ID signed (afterPack self-skips its ad-hoc
        # resign). We deliberately do NOT submit to Apple's notary — that's the
        # slow part, and alpha accepts the one-time "Open Anyway". electron-builder
        # emits alpha-mac.yml because the version is a -alpha prerelease.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/electron-builder-run.mjs --publish never

      - name: Assert differential update blockmap
        # Keep alpha representative of production update behavior. Missing this
        # file is correctness-safe, but makes every update download the full zip.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BLOCKMAP="release/Zeros-Alpha-${VERSION}-arm64-mac.zip.blockmap"
          if [ ! -f "$BLOCKMAP" ]; then
            echo "::error::$BLOCKMAP not found — electron-builder did not emit the differential-update blockmap."
            ls -la release || true
            exit 1
          fi
          echo "✓ differential-update blockmap: $BLOCKMAP"

      - name: Smoke-test terminal in the packaged app
        # Catches a native PTY that loads but cannot spawn (the beta.58
        # `posix_spawnp failed` regression) before the rolling alpha is replaced.
        run: pnpm smoke:packaged-pty

      - name: Verify installer + updater signatures
        # The updater installs the ZIP, not the DMG. Verify both independently,
        # require the expected Apple team + bundle identity + secure timestamp,
        # and prove both containers carry the same signed root before publishing.
        # Alpha is intentionally not notarized, so Gatekeeper/stapler checks stay
        # exclusive to the Production workflow.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="release/Zeros-Alpha-${VERSION}-arm64.dmg"
          ZIP="release/Zeros-Alpha-${VERSION}-arm64-mac.zip"
          node scripts/verify-macos-release-artifacts.mjs \
            --dmg "$DMG" \
            --zip "$ZIP" \
            --app-name "Zeros Alpha.app" \
            --bundle-id com.zeros.alpha \
            --team-id H8MS56JU2Z

      - name: Save signed Alpha artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeros-alpha-arm64-build-${{ github.sha }}
          overwrite: true
          if-no-files-found: error
          retention-days: 5
          path: |
            release/Zeros-Alpha-*-arm64.dmg
            release/Zeros-Alpha-*-arm64-mac.zip
            release/Zeros-Alpha-*-arm64-mac.zip.blockmap
            release/alpha-mac.yml

  publish:
    name: Publish Alpha feed
    needs: [ci, build, hosted]
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_CHANNEL: alpha
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      ZEROS_HOSTED_PROMOTION: ${{ vars.ZEROS_HOSTED_PROMOTION }}
      ZEROS_CLOUD_WORKSPACES_ENABLED: ${{ vars.ZEROS_CLOUD_WORKSPACES_ENABLED || 'false' }}
      CLOUD_WORKSPACE_PROVIDER: ${{ vars.CLOUD_WORKSPACE_PROVIDER || 'daytona' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download signed Alpha artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zeros-alpha-arm64-build-${{ github.sha }}
          path: release
      - name: Publish rolling "alpha" prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release/publication-cli.ts

          # Assert the channel feed exists — if electron-builder ever stopped
          # emitting alpha-mac.yml (e.g. channel detection changed), fail loudly
          # rather than ship a build the alpha auto-updater can't find.
          if [ ! -f release/alpha-mac.yml ]; then
            echo "::error::release/alpha-mac.yml not found — electron-builder did not emit the alpha channel feed. Ensure the version is a -alpha prerelease."
            exit 1
          fi
          DMG=""
          for CANDIDATE in release/Zeros-Alpha-*-arm64.dmg; do
            [ -f "$CANDIDATE" ] || continue
            DMG="$CANDIDATE"
            break
          done
          ZIP=""
          for CANDIDATE in release/Zeros-Alpha-*-arm64-mac.zip; do
            [ -f "$CANDIDATE" ] || continue
            ZIP="$CANDIDATE"
            break
          done
          if [ -z "$DMG" ] || [ -z "$ZIP" ]; then
            echo "::error::alpha .dmg/.zip not found in release/"
            ls -la release || true
            exit 1
          fi
          ZIP_BLOCKMAP="${ZIP}.blockmap"
          if [ ! -f "$ZIP_BLOCKMAP" ]; then
            echo "::error::alpha zip blockmap not found: $ZIP_BLOCKMAP"
            ls -la release || true
            exit 1
          fi

          # Constant-named copy of the .dmg → a PERMANENT download link that always
          # serves the newest alpha. electron-updater ignores it (it reads only the
          # versioned files listed in alpha-mac.yml); it exists purely so humans have
          # one URL that never changes:
          #   https://github.com/${GITHUB_REPOSITORY}/releases/download/alpha/Zeros-Alpha-latest-arm64.dmg
          # Made AFTER the glob above so it can never be picked up as "$DMG".
          LATEST_DMG="release/Zeros-Alpha-latest-arm64.dmg"
          cp "$DMG" "$LATEST_DMG"

          TAG="alpha"
          RELEASE_VERSION="$VERSION" pnpm exec tsx scripts/release/release-ledger-cli.ts --build
          TITLE="Zeros Alpha v${VERSION}"
          # Keep the permanent link owner-agnostic. The quoted heredoc protects
          # Markdown backticks from shell expansion; sed replaces only the
          # repository placeholder with GitHub's trusted owner/name value.
          NOTES=$(
            sed "s|__GITHUB_REPOSITORY__|${GITHUB_REPOSITORY}|g" <<'EOF'
          Rolling **alpha** — auto-built from `main`. Signed but not notarized.

          **⬇︎ Always-newest .dmg (permanent link):**
          https://github.com/__GITHUB_REPOSITORY__/releases/download/alpha/Zeros-Alpha-latest-arm64.dmg

          **First install:** right-click **Zeros Alpha.app** → Open (or System
          Settings ▸ Privacy & Security ▸ Open Anyway). One time only — every
          update after that applies in place silently via the auto-updater.

          Alpha is a separate app from production: own data, own auto-update feed.
          EOF
          )

          # ONE rolling prerelease at tag "alpha": move the tag to this commit and
          # clobber the assets each push. NOT marked --latest, so the prod
          # auto-updater (latest-mac.yml) never sees alpha builds. Alongside the
          # versioned .dmg/.zip/blockmap we (re)upload the constant "latest" .dmg
          # (permanent link) and alpha-mac.yml feed; a later step prunes to newest 3.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$DMG" "$ZIP" "$ZIP_BLOCKMAP" "$LATEST_DMG" "release/alpha-mac.yml" "release/alpha-release-ledger.json"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" \
              "$DMG" "$ZIP" "$ZIP_BLOCKMAP" "$LATEST_DMG" "release/alpha-mac.yml" "release/alpha-release-ledger.json"
          fi
          # Updating a release's target_commitish does not move an existing tag.
          # Advance the schema/worker baseline only after publishing the assets.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" -F force=true --silent
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
          pnpm exec tsx scripts/release/release-ledger-cli.ts --verify
          echo "✓ published $TITLE → release '$TAG' (prerelease, alpha-mac.yml feed)"

      - name: Prune old alpha assets (keep newest 3)
        # Best-effort retention — NEVER fail a shipped release over cleanup. Each
        # alpha's versioned .dmg/.zip/.blockmap carries a monotonic
        # "-alpha.<N>-arm64" token; we keep the 3 highest N and delete the rest.
        # The constant "latest" .dmg and alpha-mac.yml have no such token, so they
        # are always kept.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="alpha"
          KEEP=3

          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

          # Newest KEEP distinct alpha run-numbers (assets are "...-alpha.<N>-arm64...").
          # awk (not head) takes the top KEEP so sort never gets SIGPIPE under pipefail.
          KEEP_NUMS=$(printf '%s\n' "$NAMES" \
            | sed -n 's/.*-alpha\.\([0-9][0-9]*\)-arm64.*/\1/p' \
            | sort -rnu | awk -v k="$KEEP" 'NR<=k')

          # Guard: if nothing parsed (naming scheme drifted), delete NOTHING.
          if [ -z "$KEEP_NUMS" ]; then
            echo "No versioned alpha assets parsed — nothing to prune."
            exit 0
          fi
          printf 'Keeping newest %s alpha(s):' "$KEEP"
          while IFS= read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            printf ' %s' "$NUMBER"
          done <<< "$KEEP_NUMS"
          printf '\n'

          printf '%s\n' "$NAMES" | while IFS= read -r ASSET; do
            [ -n "$ASSET" ] || continue
            N=$(printf '%s\n' "$ASSET" | sed -n 's/.*-alpha\.\([0-9][0-9]*\)-arm64.*/\1/p')
            [ -n "$N" ] || continue                        # keep alpha-mac.yml + "latest" .dmg
            if ! printf '%s\n' "$KEEP_NUMS" | grep -qx "$N"; then
              echo "Pruning $ASSET (alpha.$N)"
              gh release delete-asset "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          done
