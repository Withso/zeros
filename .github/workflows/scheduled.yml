name: Scheduled smokes

# Checks that don't belong on the per-PR path. Weekly + on-demand
# (workflow_dispatch). Three reasons something lands here rather than in
# preflight.yml:
#
#   • COST — macOS runners are ~10x ubuntu minutes (native-abi, electron-pack).
#     These mirror steps release.yml already runs, surfacing packaging/native-ABI
#     breakage BEFORE you cut a release rather than during it. Unsigned, so no
#     Apple secrets are needed.
#   • REPORTING — staleness is a report, not a merge gate (runtime-drift).
#   • CREDENTIALS — preflight.yml runs on `pull_request`, which means it executes
#     UNTRUSTED fork input (arbitrary `pnpm install` lifecycle scripts) and is
#     deliberately secret-free; GitHub also withholds secrets from fork PRs
#     entirely, so a keyed gate there would be red for every external
#     contributor and green for everyone else. Anything needing a secret runs
#     here instead. No job needs one today; check Cursor's curated model ids
#     manually with `CURSOR_API_KEY=… pnpm cursor:smoke --require-models`.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-drift:
    name: bundled runtime staleness (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: How far behind latest are the bundled agent runtimes?
        # Renovate opens the "agent CLIs" PR before 6am Monday, but a PR that is
        # never merged is invisible — nothing otherwise reports that a pin has
        # been sitting behind for weeks. This queries the npm registry and
        # renders the answer onto the workflow summary page.
        #
        # STALENESS is a report — `--drift` never changes the exit code, so a pin
        # sitting behind latest does not turn the schedule red. A BROKEN pin
        # still fails: `pipefail` is set on purpose so the exit code survives the
        # tee instead of being masked by it. Without pipefail this step would
        # report a missing Claude binary on main and still go green.
        #
        # `|| status=$?` + `exit $status` rather than a bare pipeline, for two
        # reasons. It does not rely on the runner's implicit `-e` to propagate
        # the failure past the trailing `echo` (whose own exit 0 would otherwise
        # become the step's), so an explicit `shell:` without `-e` cannot turn
        # this green. And it still closes the ``` fence on the BROKEN-pin path —
        # under errexit a bare pipeline aborts the script first, leaving the
        # failure text rendered inside an unterminated code block on the summary
        # page.
        run: |
          set -o pipefail
          { echo '## Bundled agent runtime drift'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          pnpm check:runtime-pins --drift 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  native-abi:
    name: native-module ABI smoke (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules against Electron's ABI
        run: pnpm electron:rebuild
      - name: Load better-sqlite3 + node-pty under Electron's NODE_MODULE_VERSION
        # Catches the documented "NODE_MODULE_VERSION mismatch → Couldn't create
        # workspace" trap: better-sqlite3 loads for host-node but throws under
        # Electron. A packaged user can't electron-rebuild to recover.
        run: |
          ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron -e "require('better-sqlite3')(':memory:').prepare('select 1').get(); require('node-pty'); console.log('native ABI OK')"

  electron-pack:
    name: electron-builder pack smoke (macOS, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build sidecar + main + renderer
        run: |
          pnpm build:sidecar
          pnpm electron:compile
          pnpm build:ui
      - name: Smoke-test packaged engine (health + workspace lifecycle)
        # Boot the bun-compiled engine and drive it from an independent Node
        # process. This catches a bound-but-dead event loop as well as native
        # module crashes, then proves create/archive/restore through the bridge.
        run: pnpm smoke:engine
      - name: Package the .app (no publish, unsigned)
        # Exercises the asar packing + asarUnpack closure + afterPack ad-hoc
        # codesign — the only check that proves the shipped artifact is real.
        run: pnpm exec electron-builder --config electron-builder.yml --publish never --dir
      - name: Smoke-test terminal in the packaged app
        # Loading the addon is not enough; prove the shipped native helper can
        # spawn /bin/sh, stream bytes, and report a clean exit.
        run: pnpm smoke:packaged-pty
