name: Agent runtime model discovery
on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-runtime-state
  cancel-in-progress: false
env:
  ZEROS_AGENT_RUNTIME_MODE: ${{ vars.ZEROS_AGENT_RUNTIME_MODE || 'off' }}
  ZEROS_AGENT_RUNTIME_TRACKING_ISSUE: ${{ vars.ZEROS_AGENT_RUNTIME_TRACKING_ISSUE }}
  ZEROS_AGENT_RUNTIME_APP_SLUG: ${{ vars.ZEROS_AGENT_RUNTIME_APP_SLUG }}
jobs:
  discover:
    if: github.repository == 'Withso/zeros' && github.ref == 'refs/heads/main' && vars.ZEROS_AGENT_RUNTIME_MODELS == 'enabled' && (vars.ZEROS_AGENT_RUNTIME_MODE == 'notify' || vars.ZEROS_AGENT_RUNTIME_MODE == 'enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: List models using only dedicated test accounts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_RUNTIME_ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_RUNTIME_CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.AGENT_RUNTIME_OPENAI_API_KEY }}
          AGENT_RUNTIME_CODEX_AUTH_JSON: ${{ secrets.AGENT_RUNTIME_CODEX_AUTH_JSON }}
          CURSOR_API_KEY: ${{ secrets.AGENT_RUNTIME_CURSOR_API_KEY }}
          ZEROS_AGENT_RUNTIME_MODEL_SCOPE: ${{ vars.ZEROS_AGENT_RUNTIME_MODEL_SCOPE || 'dedicated-test' }}
        run: node scripts/agent-runtime/cli.mjs models --out "$RUNNER_TEMP/runtime-models"
      - name: Save sanitized listing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: agent-runtime-models-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-models/models.json
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: discover
    if: ${{ !cancelled() && needs.discover.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Publish validated model observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agent-runtime/cli.mjs publish-models
