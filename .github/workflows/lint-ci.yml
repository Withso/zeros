name: Lint CI workflows

# actionlint over .github/workflows/*.yml — catches silently-broken CI config
# (invalid ${{ }} expressions, shell-injection-prone run: interpolations, bad
# action refs, deprecated actions, shellcheck on run: blocks). The worst failure
# mode for a repo whose merge gate IS the CI. The whole dir is linted so a rename
# can't let a broken-but-unchanged file ride.
#
# Workflow changes are infrastructure changes: invalid expressions, action refs,
# or shell blocks now fail the PR instead of publishing an advisory green check.

on:
  pull_request:
    paths: [".github/workflows/**"]
  # A workflow-lint check marked Required must also exist on merge-queue SHAs.
  merge_group:
  push:
    branches: [main]
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
