name: Preflight

# The full exact-source check suite. It runs independently for every main push,
# on release-branch pushes, and on merge-queue commits. Pull
# requests use selected required jobs in `ci.yml` ("CI") and this full graph
# through `ci-full.yml` ("Full CI"), including composer smoke. Releases read this
# workflow by name and path (scripts/release/ci.ts): Beta and Production
# require a successful Preflight and CodeQL run on their exact release commit.
# Automatic Alpha can opt in to the successful alpha-gate job alone while the
# other jobs finish.
# No job here needs a secret, and the top-level `permissions:` block below keeps
# the token read-only. Parallel jobs keep failures attributable while putting
# source-sync behavior on the app's actual platform:
#
#   quality — type safety (renderer + engine + Electron main + packages) and
#             lint. CI adds an advisory Prettier pass over a PR's changed files.
#   test    — the vitest suite (two native shards behind the `test` aggregate) +
#             the repo's correctness guards (preload allowlist, model catalog,
#             Cursor asar closure, migration forward-only, secret scan,
#             settings-schema drift).
#   build   — the app must actually BUILD: renderer, engine bundle, Electron main,
#             and the bun-compiled engine sidecar binary that ships in the DMG.
#   source-sync — required aggregate for the macOS source-sync workload, which
#             also proves the shipping Apple Silicon kernel. Source-level
#             boundary contracts run once in `test`. Keeping the established
#             check name makes the existing ruleset enforce the workload job.
#   secret-scan — gitleaks over every commit a change adds, not just its net
#             diff (a PR's commit range in CI; the pushed commit here), so a
#             credential added and then removed is still caught.
#   control-plane — typecheck + audit for apps/control-plane (its own pnpm
#             workspace and lockfile) on every change, plus its vitest suite
#             sharded across Postgres service containers whenever one of that
#             suite's inputs changed. One aggregate job owns the required check.
#   ui-smoke — the Playwright-driven renderer smoke pass (real browser, real CSS).
#             Full CI also runs all browser shards on every pull request.
#
# Additional secret-free macOS work (full electron-builder pack, native ABI
# rebuild) and runtime drift share the scheduled workflow, also called by Full CI.
# The credentialed live-agent smoke (`pnpm agents:smoke`) is NOT wired into any
# workflow yet — only the offline variant runs here. The pnpm + Node setup mirrors
# release.yml so the two stay consistent (pnpm via packageManager, Node 22, pnpm
# cache).

on:
  workflow_call:
    inputs:
      full_database:
        description: Run every database shard for full pull-request assurance
        type: boolean
        default: false
  # Required checks must also run for GitHub's synthetic merge-queue commit.
  merge_group:
  push:
    branches: [main, "release/**"]

# ── Least privilege ──────────────────────────────────────
#
# Merge-queue commits can contain a fork's changes, and `ci.yml` runs the same
# jobs for every `pull_request`: both execute untrusted input — `pnpm install`
# (arbitrary lifecycle scripts), a Playwright browser install and a Postgres
# service on our runners. "These steps need no secrets" is NOT the same as
# "the token can do nothing" — without this block every job
# inherits the repository default, which is read/write on many repos. Nothing here
# writes back: checkout and `git fetch` are the only token consumers, so read is
# the entire requirement.
#
# The two companion settings live outside this file — Actions ▸ General ▸ "Require
# approval for all external contributors", and Workflow permissions ▸ read-only
# with "Allow GitHub Actions to create and approve pull requests" unchecked.
permissions:
  contents: read

# Each main push gets its own full Preflight run, keyed by run ID, so newer
# pushes neither cancel active runs nor replace pending runs. Jobs compete
# only for the organization's available runner capacity. Release branches
# and merge groups retain per-ref cancellation of their superseded runs.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('preflight-main-{0}', github.run_id) || format('preflight-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changed-files Prettier check can diff the PR
          # against its merge base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify hosted release contracts
        run: |
          pnpm --dir apps/control-plane install --frozen-lockfile
          pnpm exec tsc -p scripts/release/tsconfig.json
          pnpm exec vitest run --config scripts/release/vitest.config.ts --maxWorkers=2

      - name: Install web hub dependencies
        # apps/web is an independent npm deployment root, outside pnpm.
        run: npm --prefix apps/web ci

      # Separate typecheck steps (not the &&-chained `pnpm typecheck`) so a red
      # run tells you exactly which surface broke. Vite + tsup esbuild-strip types
      # without checking them, so this is the only real type gate for the app.
      - name: Typecheck — desktop source (renderer + engine)
        run: pnpm typecheck:app
      - name: Typecheck — Electron main + preload
        run: pnpm typecheck:electron
      - name: Typecheck — packages + marketing
        run: pnpm typecheck:packages
      - name: Typecheck — web hub + Pages Functions
        run: npm --prefix apps/web run typecheck

      - name: Lint (desktop source + Electron)
        run: pnpm lint

      - name: Design-token consistency
        # RULES.md token guardrail (no raw hex/rgba/off-scale/z-index/Tailwind
        # color classes in src). The baseline is clean, so this is a merge gate.
        run: pnpm check:ui

  test-shard:
    name: tests-vitest (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every part reports, so one failure never hides another.
      fail-fast: false
      matrix:
        # Root Vitest runs as four native shards. Part 1 also owns the
        # repository guards and part 2 the explicit containment matrix.
        # Parts 3 and 4 run the suite with the same shared setup. The `test`
        # job below remains the required aggregate.
        part: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + an explicit fetch of main below so the migration
          # forward-only guard can diff the ladder against origin/main.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install control-plane contract dependencies
        # The engine checkpoint contract exercises the real HTTP validators
        # across both independent package graphs.
        working-directory: apps/control-plane
        run: pnpm install --frozen-lockfile

      - name: Install contained-execution runtime
        uses: ./.github/actions/contained-execution-runtime

      - name: Fetch origin/main (for the migration forward-only guard)
        # Compare with the main this commit was built on, not the current tip:
        # a run can start after later merges, whose new migrations would then
        # look deleted here. A main push uses the main it was pushed onto; a
        # pull request's merge commit uses its first parent. Other events keep
        # comparing with the fetched main.
        if: matrix.part == 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            base="$PUSH_BEFORE"
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]] ||
               ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base=$(git rev-parse --verify HEAD^) || { echo "No parent commit — guard runs HEAD-only"; exit 0; }
            fi
            git update-ref refs/remotes/origin/main "$base"
          elif [ "$EVENT_NAME" = pull_request ]; then
            base=$(git rev-parse --verify HEAD^1) || { echo "No base parent — guard runs HEAD-only"; exit 0; }
            git update-ref refs/remotes/origin/main "$base"
          else
            git fetch --no-tags origin main || echo "origin/main unavailable — guard runs HEAD-only"
          fi

      - name: Check preload allowlist is in sync
        # Fails if the renderer invokes a command missing from ALLOWED_COMMANDS
        # (silent feature break), or if an unused permission widens the bridge's
        # XSS-reachable surface. Fast, so it runs before the suite.
        if: matrix.part == 1
        run: pnpm check:preload

      - name: Install Playwright Chromium headless shell
        # The Vitest suite contains real-browser design-runtime protocol tests.
        # pnpm installs Playwright's API package but intentionally not its browser.
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run vitest suite
        # Runtime-discovered integration tests exercise the same nested
        # bubblewrap/seccomp path as the explicit containment matrix below.
        env:
          VITEST_PART: ${{ matrix.part }}
        run: bash scripts/ci/with-userns.sh pnpm test:git --shard="${VITEST_PART}/4"

      - name: Cloud runtime version-skew contracts
        if: matrix.part == 1
        run: pnpm check:runtime-skew

      - name: Code + Design containment matrix
        # Stable release gate for the promise shipped today: provider profiles,
        # real Linux sandbox attacks (including ignored drafts), hard-link
        # refusal, transactional Design writes, lifecycle
        # reconciliation, and absence of a coding-agent Design API/MCP path.
        if: matrix.part == 2
        env:
          ZEROS_REQUIRE_CONTAINMENT_RUNTIME: "1"
        run: bash scripts/ci/with-userns.sh pnpm check:design-containment

      - name: Verify model catalog (strict)
        # Structural validation + the CLI-version gate: a curated model whose
        # minCliVersion exceeds the bundled SDK fails here (it would silently
        # downgrade at runtime).
        if: matrix.part == 1
        run: pnpm models:verify --strict

      - name: Cursor asarUnpack closure is covered
        # A @cursor/sdk require() not in electron-builder.yml's asarUnpack list is
        # MODULE_NOT_FOUND in the packaged DMG (Cursor dead, no dev signal). Drift
        # comes from the weekly @cursor/sdk Renovate bump.
        if: matrix.part == 1
        run: pnpm check:cursor-asar

      - name: Cursor SDK host actually loads (real spawn, source runtime)
        # The step above compares the asarUnpack globs to the require() closure
        # STATICALLY; this spawns the real cursor-host.cjs and drives a protocol
        # round-trip, so a dep that resolves in theory but not in practice fails
        # here. It needs NO credentials — the probes only have to reach auth, not
        # pass it — so unlike `agents:smoke` it can run on every PR. This run
        # covers the runtime the engine uses from source (plain node).
        if: matrix.part == 1
        run: pnpm cursor:smoke

      - name: Cursor SDK host actually works (real spawn, SHIPPED runtime)
        # The packaged app runs the host under the installed Electron binary
        # (apps/desktop/electron/sidecar.ts sets ZEROS_PTY_HOST_RUNTIME to
        # process.execPath with ELECTRON_RUN_AS_NODE=1). @cursor/sdk's default
        # local store depends on node:sqlite, whose availability can differ
        # between the CI Node runtime and Electron's bundled runtime. Exercise
        # the runtime the app actually ships.
        if: matrix.part == 1
        run: pnpm cursor:smoke:electron

      - name: Claude CLI actually launches under the Agent SDK
        # check:runtime-pins execs `claude --version`, which proves the binary
        # runs. It does NOT prove the SDK can DRIVE it — query() spawns the CLI
        # over its own control protocol, and that seam broke in production once
        # already (the SDK resolves its platform binary relative to sdk.mjs,
        # which is impossible in the bun-compiled packaged engine; every send
        # failed with "AGENT RESPONSE FAILURE" in Beta/Prod only). This drives a
        # real query() and asserts it dies on AUTH, not on resolution/spawn.
        # Costs nothing: the key is invalid and HOME is redirected to an empty
        # dir, so the turn 401s before inference — the gate asserts
        # total_cost_usd and output_tokens are both 0 rather than trusting that.
        if: matrix.part == 1
        run: pnpm claude:smoke

      - name: Codex app-server actually boots and matches the pin
        # check:codex-pin compares three version STRINGS and never touches the
        # artifact, so a missing platform package, an unspawnable binary, or a
        # handshake regression all ship green. This boots the real
        # `codex app-server`, completes the initialize handshake, and asserts
        # the RUNNING binary's version equals the installed @openai/codex — the
        # equivalent of the `claude --version` exec check, but proving the
        # protocol the committed v2 bindings were generated from. No credentials.
        if: matrix.part == 1
        run: pnpm codex:smoke

      - name: Migration ladder is forward-only
        # The shipped zeros.db is each user's only copy of their data; editing a
        # released migration never re-runs → silent divergence/loss. This enforces
        # append-only vs origin/main.
        if: matrix.part == 1
        run: pnpm check:migrations

      - name: Secret scan (tracked files)
        if: matrix.part == 1
        run: pnpm check:secrets

      - name: Third-party license inventory is current
        if: matrix.part == 1
        run: pnpm check:licenses

      - name: Production dependency audit has no unreviewed high advisory
        if: matrix.part == 1
        run: pnpm check:audit

      - name: Prod VITE_* env-set is wired into release.yml
        # A VITE_ var the app uses but release.yml doesn't inject ships a DMG
        # without it (analytics/environment routing goes dark). Names only.
        if: matrix.part == 1
        run: pnpm check:vite-env

      - name: Electron security posture intact
        # contextIsolation + sandbox + nav guards + CSP + contextBridge-only
        # preload — a regression here is renderer-XSS → RCE on the user's machine.
        if: matrix.part == 1
        run: pnpm check:electron-hardening

      - name: Codex protocol pin in lockstep
        if: matrix.part == 1
        run: pnpm check:codex-pin

      - name: Bundled agent runtime pins are exact and provable
        # The gate for Renovate's weekly "agent CLIs" PR. Every other check is
        # blind to a FORWARD bump: models:verify --strict only fires when the
        # bundled CLI is OLDER than a curated model needs, and test:adapters
        # replays committed fixtures, so both are green by construction for the
        # one direction Renovate moves. This resolves the Claude platform binary
        # and execs its own --version, so a renamed or dropped platform package
        # fails HERE instead of in release-alpha (post-merge) or the weekly cron.
        if: matrix.part == 1
        run: pnpm check:runtime-pins

      - name: electron-builder source paths resolve
        if: matrix.part == 1
        run: pnpm check:packaging-paths

      - name: Control-plane migrations naming + forward-only
        # Preserve released migration files. The migration ledger records their
        # checksums, and hosted boot verifies the ledger without applying SQL.
        if: matrix.part == 1
        run: pnpm check:control-plane-migrations

      - name: Control-plane expand/contract migration phases
        if: matrix.part == 1
        run: pnpm check:migration-phases

      - name: Desktop ↔ web deep-link schemes in lockstep
        # The desktop sends its channel's scheme to app.zeros.build; the hub only
        # echoes allow-listed ones. The two sides ship separately and drifted —
        # zeros-alpha existed in the app but not the web list, so Alpha had no
        # "Launch Zeros" button and Alpha invites opened Production. Fails closed
        # and silently, so it needs a guard rather than a reviewer.
        if: matrix.part == 1
        run: pnpm check:deep-link-schemes

      - name: Install web hub dependencies
        if: matrix.part == 1
        run: npm --prefix apps/web ci

      - name: Web hub unit tests (schemes + host routing)
        # Standalone npm package outside the pnpm workspace — its own runner.
        if: matrix.part == 1
        run: npm --prefix apps/web test

      - name: Agent stream-translator contract (offline fixtures)
        # Replays committed fixtures through the Claude translator and diffs the
        # emitted sessionUpdate sequence — catches vendor-event drift, fully offline.
        if: matrix.part == 1
        run: pnpm test:adapters

      - name: Wire-protocol version-bump reminder (advisory)
        # Flags a @zeros/protocol wire-message change without a PROTOCOL_VERSION bump.
        # Coarse file-touch heuristic → advisory.
        if: matrix.part == 1
        continue-on-error: true
        run: pnpm check:protocol

      - name: Settings schemas regenerate cleanly
        # Proves the zod settings source + generator are valid (schema.ts compiles
        # and z.toJSONSchema succeeds). Deliberately does NOT byte-compare to the
        # committed output: zod v4's z.toJSONSchema is environment-non-deterministic
        # (Node version and platform can produce different serializations), so a byte-exact
        # cross-environment match can't be a reliable gate. Schema VALIDITY is
        # covered deterministically by the static-configs-validity vitest test
        # (valid JSON + catalogs validate); genuine source↔published drift is caught
        # in PR diff review (regenerate with the repository toolchain when changing schema.ts).
        if: matrix.part == 1
        run: pnpm schemas:build


  # The repository ruleset requires `test`. Keep that context as an explicit
  # aggregate of all four Vitest parts; `always()` turns a failed or cancelled
  # part into a red required check rather than a skipped one that can be missed.
  test:
    name: test
    if: always()
    needs:
      - test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the test result
        env:
          TEST_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::TEST_RESULT was ${TEST_RESULT}"
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun (for the engine sidecar compile)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer (vite)
        # A renderer that doesn't build = a blank window for every user. No VITE_*
        # secrets injected — this is a pure compile check (absent vars resolve to
        # "" and the build still succeeds), so it stays fork-safe.
        run: pnpm build:ui

      - name: Build engine bundle (tsup)
        # codegen-codex early-exits when generated/.version matches the pin and
        # degrades without cargo, so no Rust is needed in CI.
        run: pnpm build:engine

      - name: Compile Electron main + preload (tsup)
        run: pnpm electron:compile

      - name: Compile engine sidecar binary (bun cross-compile → macOS arm64)
        # `pnpm build:sidecar` hard-exits off macOS, so invoke bun directly: it
        # cross-compiles the shipped single-file engine binary from ubuntu. This
        # is a LINK check (the arm64 binary can't run here) proving it bundles —
        # the exact artifact electron-builder drops into the DMG.
        run: bun build apps/desktop/src/cli.ts --compile --target=bun-darwin-arm64 --outfile binaries/zeros-engine-aarch64-apple-darwin

      - name: Build marketing site
        # Focused workspace diagnostic. The standalone web assembly below rebuilds
        # it from apps/marketing's independent deployment lock as the definitive gate.
        run: pnpm --filter @zeros/marketing build

      - name: Install web hub dependencies
        run: npm --prefix apps/web ci

      - name: Assemble web hub production build
        # Forces apps/marketing's independent lockfile install even though the
        # root graph is present, then verifies marketing, hub assets, and Functions
        # coexist exactly as they do in the unified Pages deployment.
        run: npm --prefix apps/web run build:standalone

  source-sync-workload:
    name: source-sync workload (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium headless shell
        # The named containment gate also proves the real headless Design
        # export path. macOS does not need Playwright's Linux system packages.
        run: pnpm exec playwright install --only-shell chromium

      - name: Bundled agent runtime pins (darwin artifact)
        # The `test` job runs this too, but on ubuntu it can only prove the
        # linux-x64 platform package. The binary that actually SHIPS is
        # darwin-arm64, and the platform packages are os/cpu-gated optional
        # deps — the shipped one installs on no other runner. This is the only
        # place the real artifact is resolved and executed before merge.
        run: pnpm check:runtime-pins

      - name: All three agent runtimes boot on the SHIPPING platform
        # Same reasoning as the step above, extended from "the pin resolves" to
        # "the runtime actually works". Everything the `test` job proves about
        # agents is linux-x64 only, because the platform packages that ship
        # (@anthropic-ai/claude-agent-sdk-darwin-arm64, @openai/codex-darwin-arm64)
        # and the Electron that hosts @cursor/sdk install on NO Linux runner.
        # The packaged app runs the Cursor SDK under Electron, so this catches
        # dependencies such as node:sqlite that may exist in the Linux job's
        # Node runtime but not Electron's bundled runtime. None need credentials.
        run: pnpm agents:smoke:offline

      - name: ZSR kernel, parity, and detached-lifecycle qualification
        # Compiles the package-owned Darwin helper, exercises real Seatbelt/SRT
        # policy, then proves setsid + double-fork teardown and next-engine
        # recovery after an intentionally abrupt engine exit. Source contracts
        # already ran in `test`; this target-architecture job owns runtime proof.
        run: pnpm check:zsr:runtime

      - name: Packaged engine health + workspace lifecycle
        # Source-mode tests do not reproduce Bun --compile runtime failures.
        # Build the actual macOS sidecar, require sustained external /health,
        # then drive create → archive → restore over its WebSocket bridge.
        run: |
          pnpm build:sidecar
          pnpm smoke:engine

      - name: Workspace lifecycle contracts
        # A named, locally reproducible merge gate for create/archive/restore/
        # delete concurrency, base-branch changes, WIP recovery, process/session
        # teardown, confirmed UI transitions, and the target-OS FSEvents watcher.
        run: pnpm test:workspace-lifecycle

      - name: Design-directory guard on the shipping platform
        # The same named gate as Linux, now on the shipping OS. This includes
        # Codex's real Seatbelt profile, Claude's native sandbox matrix,
        # territory resolution, immutable-session lifecycle, and
        # provider process-tree teardown. No credentials are required.
        env:
          ZEROS_REQUIRE_CONTAINMENT_RUNTIME: "1"
        run: pnpm check:design-containment

      - name: GitHub credential and review-provider contracts
        # The credential broker uses the target OS's process, socket, helper,
        # and file-lock behavior. Keep these exact handoff/race tests on macOS
        # rather than relying only on the broad Linux Vitest job.
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          apps/desktop/electron/__tests__/cross-process-lock.test.ts
          apps/desktop/electron/__tests__/deep-link-github.test.ts
          apps/desktop/electron/__tests__/github-app-client.test.ts
          apps/desktop/electron/__tests__/github-app-controller.test.ts
          apps/desktop/electron/__tests__/github-credential-store.test.ts
          apps/desktop/electron/__tests__/github-engine-credential.test.ts
          apps/desktop/electron/__tests__/github-pat-undo.test.ts
          packages/protocol/src/__tests__/github-auth.test.ts
          apps/desktop/src/renderer/platform/bridge/__tests__/github-app-notifications.test.ts
          apps/desktop/src/renderer/features/settings/__tests__/github-connection-model.test.ts
          apps/desktop/src/renderer/shell/pr/__tests__/create-pr-action.test.ts
          apps/desktop/src/renderer/shell/pr/__tests__/review-provider-routing.test.ts

      - name: Changes / Review contracts
        # Runs exact AD/index semantics, selection recovery,
        # stale-while-revalidate races, and the real socket error envelope.
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          apps/desktop/src/engine/git/__tests__/diff.test.ts
          apps/desktop/src/engine/git/__tests__/ops.test.ts
          apps/desktop/src/renderer/platform/bridge/__tests__/ws-client-errors.test.ts
          apps/desktop/src/renderer/shell/workbench/tabs/__tests__/changes-selection.test.ts
          apps/desktop/src/renderer/shell/workbench/tabs/__tests__/changes-scope-files.test.ts
          apps/desktop/src/renderer/shell/workbench/tabs/__tests__/changes-snapshot-cache.test.ts
          apps/desktop/src/renderer/shell/workbench/tabs/__tests__/file-lifecycle.test.ts
          apps/desktop/src/renderer/shell/workbench/tabs/__tests__/review-data-race.test.ts
          apps/desktop/src/renderer/shell/pr/__tests__/pr-status-refresh.test.ts
          apps/desktop/src/renderer/shell/pr/__tests__/use-workspace-pr-sync.test.ts
          apps/desktop/src/renderer/shell/__tests__/use-git-refresh-key.test.ts
          apps/desktop/src/renderer/shell/__tests__/workspace-file-data-cache.test.ts
          apps/desktop/src/renderer/state/__tests__/read-caches.test.ts

      - name: Files tab read + thumbnail contracts
        # These gates are realpath-shaped: read_file and read_image_thumbnail
        # resolve the target before handing it to Electron, and macOS resolves
        # its own tmpdir (/var/folders/… → /private/var/folders/…) while Linux
        # does not. The ubuntu `test` job therefore cannot fail on a path the
        # shipping platform rewrites — which is how seven broken assertions
        # merged green and then blocked every alpha release on the macOS build.
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          apps/desktop/electron/ipc/commands/__tests__/files.test.ts
          apps/desktop/electron/ipc/commands/__tests__/image-dimensions.test.ts

  # The repository ruleset already requires `source-sync (macOS)`, so keep that
  # context as an explicit aggregate for the workload job. `always()` ensures a
  # failed dependency produces a red required check rather than a skipped one
  # that can be missed. Intel Mac and arm64 Linux jobs were removed: the Mac app
  # ships for Apple Silicon only, and cloud workers run on Linux amd64, where
  # the `test` job already runs the sandbox suites.
  source-sync:
    name: source-sync (macOS)
    if: always()
    needs:
      - source-sync-workload
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the source-sync result
        env:
          SOURCE_SYNC_RESULT: ${{ needs.source-sync-workload.result }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_SYNC_RESULT" != "success" ]; then
            echo "::error::SOURCE_SYNC_RESULT was ${SOURCE_SYNC_RESULT}"
            exit 1
          fi

  # The required `control plane` check is the aggregate at the end of this
  # group. Typecheck and audit run on every change. The database suites run
  # on every main push and otherwise when one of their inputs changed
  # (scripts/ci/control-plane-scope.mjs),
  # split across shards that each own a Postgres service.
  control-plane-scope:
    name: control-plane scope
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.scope.outputs.database }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scope can diff against this change's merge base.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Decide whether the database suites run
        id: scope
        # Routed through `env:`: a `${{ github.event.* }}` value spliced into
        # `run:` is a shell-injection sink.
        env:
          # Additive assurance override; the classifier emits the same full
          # decision in its output and human-readable coverage summary.
          CI_FULL_DATABASE: ${{ inputs.full_database }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/control-plane-scope.mjs >> "$GITHUB_OUTPUT"

  control-plane-static:
    name: control-plane typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # This job installs from the control plane's own lockfile, not the
          # root workspace's — key the store cache off the file that drives it.
          cache-dependency-path: apps/control-plane/pnpm-lock.yaml
      - name: Install control-plane dependencies
        # apps/control-plane/ is its own pnpm workspace with its own lockfile,
        # and it deploys continuously from main, so this job is where a type or
        # contract break has to be caught.
        working-directory: apps/control-plane
        run: pnpm install --frozen-lockfile
      - name: Typecheck control plane
        working-directory: apps/control-plane
        run: pnpm typecheck
      - name: Audit control-plane production dependencies
        # This service deploys from its independent lockfile, so the root audit
        # cannot prove the graph Railway actually installs. Run the shared,
        # findings-first bounded retry wrapper from this workspace so a registry
        # transport message can never mask a real advisory in the same output.
        working-directory: apps/control-plane
        run: node ../../scripts/check-audit.mjs

  control-plane-database:
    name: control-plane database
    needs: control-plane-scope
    if: needs.control-plane-scope.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, so one failure never hides another.
      fail-fast: false
      matrix:
        # Keep in step with DATABASE_SHARDS in the `control-plane` job.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # The DB suite requires real Postgres; otherwise integration tests self-skip.
    # Exercise migrations before the guarded deployment step. Hosted boot only
    # verifies the migration ledger. Each shard owns an ephemeral database, so
    # its tests are free to DROP SCHEMA without touching another shard.
    services:
      postgres:
        # Match the managed database's qualified major version.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health gate the steps start before Postgres accepts
        # connections and the suite fails on a race, not a real defect.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/control-plane/pnpm-lock.yaml
      - name: Install control-plane dependencies
        working-directory: apps/control-plane
        run: pnpm install --frozen-lockfile
      - name: Install runtime contract dependencies
        # Admission tests import the actual desktop registration/client and
        # protocol schemas. Keep the service's standalone type/audit checks
        # independent of this separate workspace graph.
        run: pnpm install --frozen-lockfile
      - name: Control-plane tests (migrations + auth/invite contracts)
        working-directory: apps/control-plane
        env:
          # Presence of this is what un-skips the DB suites. If it is ever
          # unset here, the migration tests go quiet rather than red — so the
          # `control-plane` job rejects a report with a skipped DB test.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SHARD: ${{ matrix.shard }}
        run: >-
          pnpm exec vitest run --shard="${SHARD}/8"
          --reporter=default --reporter=json
          --outputFile.json="${RUNNER_TEMP}/control-plane-report/shard-${SHARD}.json"
      - name: Upload the shard's test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-database-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/control-plane-report/
          # A missing report is reported by the `control-plane` job instead.
          if-no-files-found: warn
          retention-days: 7

  # The repository ruleset requires `control plane`. `always()` ensures a failed
  # dependency produces a red required check rather than a skipped one. The
  # database shards' JSON reports replace the old skip-guard re-run: they must
  # cover every test file once, with no failed or skipped DB-backed test.
  control-plane:
    name: control plane
    if: always()
    needs:
      - control-plane-scope
      - control-plane-static
      - control-plane-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download database shard reports
        if: needs.control-plane-scope.outputs.database == 'true'
        # A missing report fails the next step with the shard that lost it.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: control-plane-database-report-*
          path: ${{ runner.temp }}/control-plane-reports
          merge-multiple: true
      - name: Enforce control-plane results
        env:
          SCOPE_RESULT: ${{ needs.control-plane-scope.result }}
          DATABASE_SCOPE: ${{ needs.control-plane-scope.outputs.database }}
          STATIC_RESULT: ${{ needs.control-plane-static.result }}
          DATABASE_RESULT: ${{ needs.control-plane-database.result }}
          DATABASE_SHARDS: 8
        run: node scripts/ci/control-plane-results.mjs "$RUNNER_TEMP/control-plane-reports"

  # Automatic Alpha consumes this job from the newest exact-SHA main push
  # attempt. The full Preflight run continues for release evidence and history.
  alpha-gate:
    name: alpha-gate
    # Full CI's PR invocation supplies coverage, never Alpha admission.
    if: always() && github.event_name != 'pull_request'
    needs: [quality, test, build, control-plane, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the Alpha gate results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTROL_PLANE_RESULT: ${{ needs.control-plane.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          for check in QUALITY_RESULT TEST_RESULT BUILD_RESULT CONTROL_PLANE_RESULT SECRET_SCAN_RESULT; do
            if [ "${!check}" != "success" ]; then
              echo "::error::${check} was ${!check}"
              exit 1
            fi
          done

  ui-smoke-shard:
    name: tests-ui-smoke (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install control-plane dependencies for title smoke
        run: pnpm --dir apps/control-plane install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run composer UI smoke shard
        # Real-browser event-timing coverage the unit suite structurally cannot
        # provide: a document-capture click listener can race Radix's open/focus
        # sequence, making the model dropdown flash open and instantly close.
        # Drives the actual ModelPill/AgentModelMenu tree headlessly.
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm test:ui-smoke --shard="${SHARD}/3"

  ui-smoke:
    name: ui-smoke (composer)
    if: always()
    needs: [ui-smoke-shard]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce composer UI smoke result
        env:
          UI_SMOKE_RESULT: ${{ needs.ui-smoke-shard.result }}
        run: |
          set -euo pipefail
          if [ "$UI_SMOKE_RESULT" != "success" ]; then
            echo "::error::UI_SMOKE_RESULT was ${UI_SMOKE_RESULT}"
            exit 1
          fi

  secret-scan:
    name: secret scan (PR commit range)
    # CI owns the required PR commit-range scanner. Avoid a second scanner in
    # Full CI; direct push/merge-group Preflight keeps its existing scan.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # ── Why the PR's COMMIT RANGE, not the tree and not all history ──
    #
    # `pnpm check:secrets` (in the `test` job) scans the TRACKED WORKING TREE — it
    # can only ever see what HEAD looks like right now. A credential that a PR
    # commits and then "removes" in a later commit of the SAME PR is invisible to
    # it, and stays perfectly readable to anyone who clones a public repo because
    # the blob is still in the object store. Closing that gap is why this job
    # exists, and why `fetch-depth: 0` is load-bearing — gitleaks needs the real
    # commit graph to walk `base..HEAD`.
    #
    # It deliberately does NOT re-scan all history on every PR: the existing
    # history is a fixed publication baseline, while this gate must answer the
    # review question "did this PR add a credential in any commit?" Full history
    # is audited out of band before publication and after importing or rewriting
    # refs:
    #     gitleaks git . --redact --no-banner --verbose
    #
    # Non-zero exit on a finding fails the job — no `continue-on-error`. A secret
    # scanner that reports and passes trains everyone to ignore it.
    steps:
      - name: Checkout (full depth — gitleaks needs the commit graph)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the PR commit range
        id: range
        # Routed through `env:` rather than interpolated directly into the script:
        # a `${{ github.event.* }}` value spliced into `run:` is a shell-injection
        # sink. On a push (no pull_request payload) there is no base, so fall back
        # to the single pushed commit.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            echo "log_opts=--no-merges ${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--no-merges -1 HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks
        # Upstream gitleaks CONTAINER pinned by digest, deliberately not
        # `gitleaks/gitleaks-action`: since v2 that JS wrapper is non-MIT and
        # refuses to run on organization-owned repositories without a
        # GITLEAKS_LICENSE secret, which would make this job fail for a licensing
        # reason rather than a security one. The container is the same scanner with
        # no such gate, and a digest is the container-registry equivalent of the
        # commit-SHA pins used for every `uses:` above.
        #
        # WHY `docker run` AND NOT `uses: docker://…`
        #
        # `--log-opts` takes ONE value that contains a space ("--no-merges
        # <base>..HEAD"). The `uses: docker://` form hands `with.args` to the
        # container as a whitespace-split argv, so that single value arrived as
        # two arguments and gitleaks refused the run before scanning anything:
        #     Error: accepts at most 1 arg(s), received 2
        # A gate that exits non-zero for an argv reason looks exactly like a gate
        # that found a secret, so this had to become unambiguous rather than
        # merely quoted — `with.args` has no documented quoting semantics, while
        # the shell's are exact. Both branches of the range step emit a space, so
        # the push/merge_group path was equally broken.
        #
        # `git .` walks history from the checked-out repo (mounted at
        # /github/workspace); `--log-opts` narrows that walk to the commits this
        # change actually adds. `--redact` keeps a matched credential out of the
        # public build log — the alert is the finding, not the value.
        #
        # The container runs as root while the checkout is owned by the runner
        # user — normally git's dubious-ownership guard territory. The image
        # already ships `git config --global --add safe.directory '*'`; the
        # GIT_CONFIG_* trio restates that for this one path so the job can't
        # silently start failing if upstream ever drops that line.
        #
        # No `--config`: the default ruleset is used. `.gitleaksignore` may
        # suppress only reviewed, exact finding fingerprints; broad rule/path
        # allowlists remain prohibited.
        #
        # `LOG_OPTS` is routed through `env:` for the same reason the range step
        # routes `BASE_SHA`: a `${{ }}` value spliced straight into `run:` is a
        # shell-injection sink.
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/github/workspace" \
            --workdir /github/workspace \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/github/workspace \
            "$GITLEAKS_IMAGE" \
            git . --redact --no-banner --verbose --log-opts="$LOG_OPTS"
