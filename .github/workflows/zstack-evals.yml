name: Zstack Eval Corpus

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zstack-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Nightly regression catches
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout full history and objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/control-plane/pnpm-lock.yaml
      - name: Install root and control-plane graphs
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/control-plane install --frozen-lockfile
      - name: Install browser prerequisite
        run: pnpm exec playwright install --with-deps chromium
      - name: Replay every case and compare the committed baseline
        timeout-minutes: 160
        env:
          ZSTACK_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          git --no-lazy-fetch rev-parse HEAD
          mkdir -p .context
          node scripts/zstack/eval-corpus.mjs --execute \
            --revision "$ZSTACK_REVISION" --batch-size 32 --timeout-minutes 150 \
            --baseline agents/zstack/evals/baseline.json \
            --dependency-cache "$RUNNER_TEMP/zstack-dependencies" \
            --output .context/zstack-eval-corpus
      - name: Upload every batch and partial receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zstack-eval-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/zstack-eval-corpus/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
