name: Full CI

# Independent assurance keeps every existing workload running while CI's
# path-selected required contexts remain the fast merge gate. Reusing the
# workflows gives these checks distinct "Full suite / ..." and "Extended
# checks / ..." names; they cannot satisfy an existing required CI context.
# Main/release pushes already run Preflight directly, so only the additional
# native ABI, unsigned packaging and runtime drift jobs are repeated there.
on:
  pull_request:
  push:
    branches: [main, "release/**"]

# Fork source executes install/build scripts. No inherited secrets, protected
# environment, deployment authority or pull_request_target event is permitted.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-full-pr-{0}', github.event.pull_request.number) || format('ci-full-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Full suite
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/preflight.yml
    with:
      full_database: true

  extended:
    name: Extended checks
    uses: ./.github/workflows/scheduled.yml
