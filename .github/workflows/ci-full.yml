name: Full CI

# PR CI owns both selected and complementary verification in one run. Pushes
# retain the additional native ABI, unsigned packaging and runtime drift jobs;
# main/release Preflight still executes its full independent exact-SHA graph.
on:
  push:
    branches: [main, "release/**"]

# Fork source executes install/build scripts. No inherited secrets, protected
# environment, deployment authority or pull_request_target event is permitted.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-full-pr-{0}', github.event.pull_request.number) || format('ci-full-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extended:
    name: Extended checks
    uses: ./.github/workflows/scheduled.yml
