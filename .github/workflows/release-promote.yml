name: Promote release candidate

# Manual-only. After release.yml published a release candidate from
# release/X.Y.Z and it has been used in a staff Production app, run:
#   gh workflow run release-promote.yml --ref release/X.Y.Z
#
# Publishes the candidate's EXACT notarized files as vX.Y.Z, marked Latest, and
# writes the Production release ledger. Nothing is rebuilt and no hosted service,
# migration or cloud runtime changes here: release.yml already promoted them.
# scripts/release/candidate.ts refuses a receipt for another version or commit,
# changed bytes, a moved rc tag or branch, a candidate whose release.yml
# publication did not succeed, or a live Production backend serving a different
# source. The candidate and guard live in scripts/release/.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The same destination lock as release.yml: a promotion never overlaps a
  # candidate publication or another promotion.
  group: release-production
  cancel-in-progress: false

jobs:
  approve:
    name: Approve Production promotion
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: production-approval
    permissions: {}
    steps:
      - name: Record the approved promotion
        run: echo "Production promotion approved for $GITHUB_SHA on $GITHUB_REF_NAME"

  promote:
    name: Promote to Production
    needs: approve
    if: github.event.repository.fork == false && needs.approve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_CHANNEL: production
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Require a release branch
        run: |
          if ! printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/release/[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Promote from the candidate's release/X.Y.Z branch (got: $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_BRANCH#release/}"
          mkdir -p release
          gh release download rc --repo "$GITHUB_REPOSITORY" --dir release --clobber \
            --pattern "Zeros-${VERSION}-arm64.dmg" \
            --pattern "Zeros-${VERSION}-arm64-mac.zip" \
            --pattern "Zeros-${VERSION}-arm64-mac.zip.blockmap" \
            --pattern "rc-mac.yml" \
            --pattern "rc-candidate.json"
      - name: Verify the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release/candidate-cli.ts --verify
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_BRANCH#release/}"
          TAG="v${VERSION}"
          RELEASE_VERSION="$VERSION" pnpm exec tsx scripts/release/release-ledger-cli.ts --build

          # Auto-generated, PR-based notes grouped per .github/release.yml, with
          # @-handle credits stripped so a permanent release body is not a ping target.
          GENERATED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body 2>/dev/null || true)
          if [ -n "$GENERATED" ]; then
            GENERATED=$(printf '%s\n' "$GENERATED" \
              | sed -E 's/ by @[A-Za-z0-9][A-Za-z0-9-]*( in )/\1/g' \
              | sed -E '/^\*? ?@[A-Za-z0-9][A-Za-z0-9-]* made their first contribution/d' \
              | sed -E '/^#+ New Contributors[[:space:]]*$/d')
          fi
          INSTALL=$(cat <<'EOF'
          ## Install

          1. Download `Zeros-__V__-arm64.dmg` below.
          2. Open it and drag **Zeros.app** into `/Applications`.
          3. Launch from Spotlight / Finder.

          Installed apps update in place via the built-in auto-updater.
          EOF
          )
          INSTALL="${INSTALL//__V__/$VERSION}"
          FOOTER=$'\n\n---\n'"📝 Curated highlights & media: https://zeros.build/changelog"
          BODY="${INSTALL}"$'\n\n'"${GENERATED}${FOOTER}"

          # Idempotent: a retried promotion replaces its own partial release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          fi

          # The candidate's verified bytes, under their Latest names: the updater
          # reads latest-mac.yml, and the website links the stable-named dmg
          # (/releases/latest/download/Zeros-arm64.dmg, apps/marketing/src/lib/site.ts).
          cp "release/rc-mac.yml" "release/latest-mac.yml"
          cp "release/Zeros-${VERSION}-arm64.dmg" "release/Zeros-arm64.dmg"

          # --target pins vX.Y.Z to the commit the candidate was built from, not to
          # the default branch's head.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zeros v${VERSION}" \
            --latest \
            --notes "$BODY" \
            "release/Zeros-${VERSION}-arm64.dmg" \
            "release/Zeros-arm64.dmg" \
            "release/Zeros-${VERSION}-arm64-mac.zip" \
            "release/Zeros-${VERSION}-arm64-mac.zip.blockmap" \
            "release/latest-mac.yml" \
            "release/release-ledger.json"
          pnpm exec tsx scripts/release/release-ledger-cli.ts --verify
          echo "✓ promoted Zeros v${VERSION} to Latest"
          echo "Keep its client contracts: pnpm client-contract:release ${VERSION}"
