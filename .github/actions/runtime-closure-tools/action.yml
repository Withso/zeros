name: Offline Runtime Closure Tools
description: >-
  Install namespace and native systemd build tools for offline artifact checks.
  These tools qualify the shipped bundle; agents use the workspace VM identity.

runs:
  using: composite
  steps:
    - name: Install offline artifact closure tools
      shell: bash
      run: |
        set -euo pipefail
        # The Ubuntu amd64 archive has a healthy HTTPS endpoint. Arm64 uses
        # ports.ubuntu.com and must retain its own mirror configuration.
        runner_ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        if [ "$(uname -m)" = "x86_64" ] && [ -f "$runner_ubuntu_sources" ]; then
          sudo sed -i \
            's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' \
            "$runner_ubuntu_sources"
        fi
        # Use the runner image's packages when it already has them; otherwise
        # retry, since a DNS blip ("Temporary failure resolving") failed every
        # Vitest shard. Error-Mode=any makes a failed index fetch fail the
        # update so it retries instead of installing from stale lists.
        packages="bubblewrap util-linux libsystemd-dev"
        # shellcheck disable=SC2086
        if [ "$(dpkg-query -W -f='${db:Status-Status}\n' $packages 2>/dev/null | grep -cx installed)" -ne 3 ]; then
          bash "$PWD/scripts/ci/retry.sh" sudo apt-get update -o APT::Update::Error-Mode=any
          # shellcheck disable=SC2086
          bash "$PWD/scripts/ci/retry.sh" sudo apt-get install --yes $packages
        fi
        command -v setpriv

    - name: Verify offline artifact namespace prerequisites
      shell: bash
      run: |
        set -euo pipefail
        bash "$PWD/scripts/ci/with-userns.sh" \
          bwrap \
            --ro-bind / / \
            --unshare-pid \
            --unshare-user \
            --cap-drop ALL \
            --proc /proc \
            --die-with-parent \
            -- /bin/true
