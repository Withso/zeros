<!doctype html>
<!-- Static 404 for the unified zeros-web Pages project (both hosts).
     Its presence in dist/ matters beyond the page itself: without a top-level
     404.html, Cloudflare Pages treats the deployment as an SPA and serves
     index.html with 200 for ANY unmatched path — which made
     app.zeros.build/<unknown> render the marketing homepage. Keep this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Zeros</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0; display: grid; place-items: center;
        background: #0c0c0d; color: #e6e6e6; text-align: center;
        font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .code { font-size: 13px; letter-spacing: 0.08em; color: #a1a1aa; margin-bottom: 0.5rem; }
      h1 { font-size: 18px; font-weight: 600; color: #f4f4f5; margin: 0 0 0.35rem; }
      p { color: #a1a1aa; font-size: 13px; margin: 0 0 1.5rem; }
      a {
        display: inline-block; padding: 0.5rem 1.1rem; border-radius: 999px;
        background: #ffffff; color: #0c0c0d; font-weight: 600; font-size: 13px;
        text-decoration: none;
      }
      a:hover { background: #e6e6e6; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you&rsquo;re looking for doesn&rsquo;t exist or has moved.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
