packages:
  - "packages/*"
  - "website/marketing"

# Note: a sibling app, the legacy `website/accounts` site and its
# `packages/auth-client` — all on the retired Supabase project — were removed in
# the 2026-06 cleanup. An empty, untracked `apps/` husk may remain on disk; it
# no longer participates in this workspace and is gitignored.
#
# Note: website/web-app (Cloudflare Pages project `zeros-web` — app.zeros.build
# hub/auth/handoff AND zeros.build marketing, assembled at build time) is
# intentionally excluded from this workspace. It has its own package.json /
# package-lock.json so Cloudflare can `npm install` Functions deps without
# touching the root pnpm-lock.yaml. Marketing source stays a workspace member
# (`website/marketing`) but ALSO commits its own pnpm-lock.yaml: zeros-web's
# assemble-marketing.mjs runs `pnpm install --ignore-workspace
# --frozen-lockfile` inside website/marketing during the Pages build, so CF
# never installs the monorepo's Electron/native deps (`--filter` can't narrow
# a workspace install — pnpm/pnpm#8318). After changing marketing's
# package.json, regenerate that lockfile:
#   cd website/marketing && pnpm install --ignore-workspace --lockfile-only
# (The retired website/auth-app was folded into web-app on 2026-07-06.)

# pnpm v10 moved package-level "pnpm" settings to the workspace yaml. The
# previous home in package.json's `"pnpm": { ... }` block prints a deprecation
# warning on every install ("The 'pnpm' field in package.json is no longer
# read by pnpm. The following keys were ignored: pnpm.onlyBuiltDependencies").
# `onlyBuiltDependencies` is an allowlist of packages whose postinstall scripts
# we trust to run. Keep this list tight: native-binding packages
# (better-sqlite3, node-pty) need it; everything else stays script-blocked for
# supply-chain safety.
#
# `electron` is KEPT here but is now a no-op, on purpose. Electron 42 removed its
# postinstall binary download (npm postinstall being a favoured supply-chain
# attack vector) — `electron@43`'s package.json has NO `scripts` field at all.
# The binary is fetched lazily on the first `electron` run instead, or eagerly by
# the new `install-electron` bin. The entry stays so that (a) this comment exists
# where someone would look, and (b) nothing changes if upstream ever reintroduces
# a build step. See scripts/electron-rebuild-sqlite.cjs for the ABI half.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-builder
  - esbuild
  - "@parcel/watcher"
  - node-pty
  # @cursor/sdk eagerly imports `sqlite3` (its default local checkpoint
  # store) at the top of its bundle, so the native binding must build for
  # the SDK to import at all — even when we pass a JsonlLocalAgentStore.
  - sqlite3
  # @vscode/ripgrep downloads a prebuilt `rg` binary in postinstall; the
  # cursor-sdk adapter points CURSOR_RIPGREP_PATH at it so @cursor/sdk's
  # codebase search / ignore-mapping works (it doesn't bundle ripgrep).
  - "@vscode/ripgrep"

# ──────────────────────────────────────────────────────────
# overrides — floors that a transitive range is too loose to guarantee
# ──────────────────────────────────────────────────────────
#
# node-abi is a LOOKUP TABLE mapping runtime version → Node ABI number, and it
# only knows the Electron majors that existed when it was published. Every
# Electron major bump therefore needs a node-abi new enough to contain the new
# row, or `pnpm electron:rebuild` dies with:
#
#   Could not detect abi for version 43.2.0 and runtime electron
#
# which is what happened on the 33 → 43 bump: @electron/rebuild declares
# `node-abi: ^4.2.0`, a range wide enough to ALLOW a current version but not to
# require one, so the lockfile happily sat on 4.28.0 (last Electron it knows: 42).
# A floor here makes the requirement explicit rather than a lockfile accident.
# 4.33.0 maps electron 43 → ABI 148, which matches node_modules/electron/abi_version.
#
# WHEN BUMPING ELECTRON: raise this floor in the same commit. Renovate cannot do
# it for you — renovate.json disables every package except the three agent CLIs,
# so node-abi will never be auto-updated and the next major will hit this again.
overrides:
  node-abi: "^4.33.0"
