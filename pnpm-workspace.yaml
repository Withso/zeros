packages:
  - "apps/feedback-worker"
  - "apps/marketing"
  - "packages/*"

# Independent deployment boundaries:
#
# - apps/web uses npm and its own lockfile because Cloudflare Pages installs
#   Functions dependencies from that directory. Its build installs and assembles
#   apps/marketing without resolving the desktop/native dependency graph.
# - apps/control-plane uses its own pnpm lockfile and deploys independently on
#   Railway. Root scripts enter that directory explicitly for control-plane checks.
#
# After changing apps/marketing/package.json, refresh the deployment lockfile:
#   pnpm --dir apps/marketing install --ignore-workspace --lockfile-only

# pnpm permits dependency lifecycle scripts only for this reviewed allowlist.
# Native bindings and downloaded runtime tools require their install steps;
# everything else remains blocked by default for supply-chain safety.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-builder
  - esbuild
  - "@parcel/watcher"
  - node-pty
  - sqlite3
  - "@vscode/ripgrep"

# @electron/rebuild accepts a broad node-abi range, but each Electron major
# requires a node-abi release that knows its ABI mapping. Raise this floor in the
# same change as an Electron major-version update.
overrides:
  node-abi: "^4.33.0"
  # Transitive security floors. Each version stays within the consuming
  # package's supported range; keep the override until its parent lock entry
  # naturally resolves to an equal or newer release.
  "@hono/node-server": "2.1.0"
  body-parser: "2.3.0"
  fast-uri: "3.1.5"
  hono: "4.13.0"
  ip-address: "10.3.1"
  js-yaml: "4.3.0"
  qs: "6.15.2"
