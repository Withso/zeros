packages:
  - "apps/cloud-worker"
  - "apps/marketing"
  - "packages/*"

# Independent deployment boundaries:
#
# - apps/web uses npm and its own lockfile because Cloudflare Pages installs
#   Functions dependencies from that directory. Its build installs and assembles
#   apps/marketing without resolving the desktop/native dependency graph.
# - apps/control-plane uses its own pnpm lockfile and deploys independently on
#   Railway. Root scripts enter that directory explicitly for control-plane checks.
#
# After changing apps/marketing/package.json, refresh the deployment lockfile:
#   pnpm --dir apps/marketing install --ignore-workspace --lockfile-only

# pnpm permits dependency lifecycle scripts only for this reviewed allowlist.
# Native bindings and downloaded runtime tools require their install steps;
# everything else remains blocked by default for supply-chain safety.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-builder
  - esbuild
  - "@parcel/watcher"
  - node-pty
  - sqlite3
  - "@vscode/ripgrep"

# @electron/rebuild accepts a broad node-abi range, but each Electron major
# requires a node-abi release that knows its ABI mapping. Raise this floor in the
# same change as an Electron major-version update.
overrides:
  node-abi: "^4.33.0"
  # Transitive security floors. Compatibility exceptions are documented beside
  # their entries; keep each override until its parent lock entry naturally
  # resolves to an equal or newer release.
  "@hono/node-server": "2.1.0"
  "@babel/core": "7.29.6"
  axios: "1.20.0"
  baseline-browser-mapping: "2.11.0"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  browserslist: "4.28.7"
  builder-util-runtime: "9.7.0"
  body-parser: "2.4.0"
  "esbuild@0.27.3": "0.28.1"
  fast-uri: "3.1.9"
  fflate: "0.4.9"
  follow-redirects: "1.16.1"
  form-data: "4.0.6"
  hono: "4.13.11"
  ip-address: "10.7.4"
  js-yaml: "4.3.2"
  joi: "18.2.9"
  nanoid: "3.3.18"
  # Typography pins an older 6.x parser; 6.1.5 fixes GHSA-rj75-hqrm-r3gf.
  "postcss-selector-parser@<6.1.5": "6.1.5"
  # express accepts ~2.0.7; 2.0.8 fixes GHSA-jqcg-44mw-7w3h.
  proxy-addr: "2.0.8"
  qs: "6.16.1"
  shell-quote: "1.11.0"
  tar: "7.5.21"
  tmp: "0.2.7"
  "undici@6": "6.29.1"
  "undici@7": "7.30.1"
  vitest: "4.1.12"
  # postcss accepts ^1.2.1; 1.2.2 fixes GHSA-68fv-2mgg-jv7q.
  source-map-js: "1.2.2"

# Cursor's zod peer now resolves to the patched root version. Keep production
# audits free of exceptions; scripts/__tests__/audit-exceptions.test.ts guards
# the locked zod and body-parser floors.
auditConfig:
  ignoreGhsas: []

# Cursor SDK 1.0.35 bundles its Node transport and no longer installs Undici 5.
# Its former Busboy override and Undici advisory exceptions have been retired.
patchedDependencies:
  # Retain fixed-width Ed25519 public keys with leading zero bytes.
  "ssh2@1.17.0": patches/ssh2@1.17.0.patch
  # Keep the generated macOS keychain password separate from P12 passwords.
  "app-builder-lib@26.15.0": patches/app-builder-lib@26.15.0.patch
  # Retire the thumb animation loop when its viewport or surface is removed.
  "@radix-ui/react-scroll-area@1.2.10": patches/@radix-ui__react-scroll-area@1.2.10.patch
