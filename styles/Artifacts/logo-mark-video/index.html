<!DOCTYPE html>
<html lang="en" data-Zeros-root data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeros — Logo mark · data volume</title>
  <style>
    :root {
      color-scheme: dark;
      --bg1: hsl(0 0% 7%);
      --bg1-hover: hsl(0 0% 12%);
      --bg2: hsl(0 0% 13%);
      --bg2-hover: hsl(0 0% 15%);
      --bg3: hsl(0 0% 9%);
      --fg1: hsl(0 0% 94%);
      --fg2: hsl(0 0% 72%);
      --fg3: hsl(0 0% 44%);
      --muted-fg: hsl(0 0% 44%);
      --border2: hsl(0 0% 18%);
      --border3: hsl(0 0% 24%);
      --border4: hsl(0 0% 30%);
      --highlighted-bright: hsl(0 0% 65%);
      --inverted-bg: hsl(0 0% 92%);
      --inverted-fg: hsl(0 0% 5%);
      --font-sans: "Geist Variable", ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg1);
      color: var(--fg2);
      font-family: var(--font-sans);
    }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    header { border-bottom: 1px solid var(--border2); }

    footer {
      border-top: 1px solid var(--border2);
      color: var(--muted-fg);
      font-size: 12px;
    }

    h1 {
      margin: 0;
      color: var(--fg1);
      font-size: 14px;
      font-weight: 500;
    }

    .lede {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--fg3);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      appearance: none;
      border: 1px solid var(--border3);
      background: var(--bg1);
      color: var(--fg1);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .chip:hover { background: var(--bg1-hover); }

    .chip[aria-pressed="true"] {
      background: var(--bg1-hover);
      border-color: var(--border4);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      overflow: hidden;
      background: var(--stage-bg, var(--bg1));
    }

    .stage[data-bg="void"] { --stage-bg: hsl(0 0% 7%); }

    .stage[data-bg="checker"] {
      --stage-bg: hsl(0 0% 12%);
      background-image:
        linear-gradient(45deg, hsl(0 0% 16%) 25%, transparent 25%),
        linear-gradient(-45deg, hsl(0 0% 16%) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, hsl(0 0% 16%) 75%),
        linear-gradient(-45deg, transparent 75%, hsl(0 0% 16%) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    .stage[data-bg="paper"] { --stage-bg: hsl(40 18% 92%); }

    .stage[data-bg="magenta"] { --stage-bg: hsl(312 92% 52%); }

    .mark {
      position: relative;
      width: min(72vmin, 720px);
      aspect-ratio: 1;
    }

    .mark video,
    .mark canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    .is-hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Zeros mark</h1>
      <p class="lede" id="lede">Smaller mark, faster field, 10s loop — v4</p>
    </div>
    <div class="controls">
      <div class="chips" role="group" aria-label="Version">
        <button class="chip" type="button" data-version="v4" aria-pressed="true">v4 · smaller + faster</button>
        <button class="chip" type="button" data-version="v3" aria-pressed="false">v3</button>
        <button class="chip" type="button" data-version="v2" aria-pressed="false">v2</button>
        <button class="chip" type="button" data-version="v1" aria-pressed="false">v1</button>
      </div>
      <div class="chips" role="group" aria-label="Stage background">
        <button class="chip" type="button" data-bg="void" aria-pressed="true">Void</button>
        <button class="chip" type="button" data-bg="checker" aria-pressed="false">Checker</button>
        <button class="chip" type="button" data-bg="paper" aria-pressed="false">Paper</button>
        <button class="chip" type="button" data-bg="magenta" aria-pressed="false">Magenta</button>
      </div>
    </div>
  </header>

  <main class="stage" data-bg="void" data-version="v4">
    <div class="mark" aria-label="Zeros logo formed by a swirling number field">
      <video
        id="play"
        muted
        loop
        playsinline
        autoplay
        poster="zeros-logo-data-v4-poster.jpg"
        src="zeros-logo-data-v4.mp4"
      ></video>
      <video
        id="native"
        class="is-hidden"
        muted
        loop
        playsinline
        poster="zeros-logo-data-poster.png"
      >
        <source src="zeros-logo-data.webm" type="video/webm" />
      </video>
      <canvas id="keyed" class="is-hidden" width="720" height="720"></canvas>
      <video id="source" muted loop playsinline hidden preload="auto">
        <source src="zeros-logo-data-source.mp4" type="video/mp4" />
      </video>
    </div>
  </main>

  <footer>
    <span id="meta">Seedance 2.5 · 1:1 · 1080p · 10s loop · v4</span>
    <span>No logo stroke — form from rim density</span>
  </footer>

  <script>
    const stage = document.querySelector(".stage");
    const lede = document.getElementById("lede");
    const meta = document.getElementById("meta");
    const bgChips = [...document.querySelectorAll("[data-bg]")];
    const versionChips = [...document.querySelectorAll("[data-version]")];
    const play = document.getElementById("play");
    const native = document.getElementById("native");
    const keyed = document.getElementById("keyed");
    const source = document.getElementById("source");
    const files = {
      v4: { src: "zeros-logo-data-v4.mp4", poster: "zeros-logo-data-v4-poster.jpg", lede: "Smaller mark, faster field, 10s loop — v4", meta: "Seedance 2.5 · 1:1 · 1080p · 10s loop · v4" },
      v3: { src: "zeros-logo-data-v3.mp4", poster: "zeros-logo-data-v3-poster.jpg", lede: "10s edit of v2 — v3", meta: "Seedance 2.5 · 1:1 · 1080p · 10s · v3" },
      v2: { src: "zeros-logo-data-v2.mp4", poster: "zeros-logo-data-v2-poster.jpg", lede: "Rim light + scatter — v2", meta: "Seedance 2.5 · 1:1 · 1080p · 5s · v2" },
    };

    let keyRunning = false;

    bgChips.forEach((chip) => {
      chip.addEventListener("click", () => {
        stage.dataset.bg = chip.dataset.bg;
        bgChips.forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
      });
    });

    versionChips.forEach((chip) => {
      chip.addEventListener("click", () => setVersion(chip.dataset.version));
    });

    function lumaKeyFrame(ctx, w, h) {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722;
        d[i + 3] = Math.max(0, Math.min(255, (l - 10) * 3.4));
      }
      ctx.putImageData(img, 0, 0);
    }

    function startCanvasKey() {
      keyed.classList.remove("is-hidden");
      const ctx = keyed.getContext("2d", { willReadFrequently: true });
      const w = keyed.width;
      const h = keyed.height;
      if (keyRunning) return;
      keyRunning = true;
      const tick = () => {
        if (stage.dataset.version !== "v1") {
          keyRunning = false;
          return;
        }
        if (source.readyState >= 2) {
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(source, 0, 0, w, h);
          lumaKeyFrame(ctx, w, h);
        }
        requestAnimationFrame(tick);
      };
      source.play().catch(() => {});
      tick();
    }

    function showV1Keyed() {
      const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const webm = native.canPlayType('video/webm; codecs="vp9"');
      if (!safari && webm) {
        native.classList.remove("is-hidden");
        native.play().catch(() => startCanvasKey());
        native.addEventListener("error", startCanvasKey, { once: true });
      } else {
        startCanvasKey();
      }
    }

    function setVersion(version) {
      stage.dataset.version = version;
      versionChips.forEach((c) => {
        c.setAttribute("aria-pressed", String(c.dataset.version === version));
      });

      native.classList.add("is-hidden");
      keyed.classList.add("is-hidden");
      native.pause();
      source.pause();

      if (files[version]) {
        play.classList.remove("is-hidden");
        play.poster = files[version].poster;
        play.src = files[version].src;
        play.play().catch(() => {});
        lede.textContent = files[version].lede;
        meta.textContent = files[version].meta;
      } else {
        play.pause();
        play.classList.add("is-hidden");
        showV1Keyed();
        lede.textContent = "Contained glyphs, keyed alpha — v1";
        meta.textContent = "Seedance 2.5 · 1:1 · 1080p · 5s · v1";
      }
    }

    play.play().catch(() => {});
  </script>
</body>
</html>
